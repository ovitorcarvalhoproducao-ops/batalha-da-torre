<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalha da Torre - Draft Oficial</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Unbounded -->
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        .font-unbounded { font-family: 'Unbounded', sans-serif; }
        
        /* Velocidade da animação dos nomes trocando de trios */
        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation-duration: 0.25s;
        }

        /* Grid de Fundo com linhas verticais e horizontais em vermelho opaco */
        body {
            background-color: #09090b; /* zinc-950 */
            background-image: 
                linear-gradient(rgba(220, 38, 38, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(220, 38, 38, 0.08) 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: center center;
            transition: background-color 0.3s ease;
        }

        /* Ocultar scrollbar dos trios mas permitir rolagem */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        /* Estilos para o efeito de peso e movimento 3D dos trios e modais */
        .trio-tilt-card {
            transition: transform 0.15s cubic-bezier(0.01, 0.98, 0.52, 0.99), box-shadow 0.2s ease;
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* Animação fluida de entrada para os Popups */
        @keyframes modal-pop {
            0% { opacity: 0; transform: scale(0.95) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-modal-pop {
            animation: modal-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* REGRAS DE INVERSÃO PARA O MODO CLARO */
        body.light-mode {
            background-color: #f4f4f5; /* Fundo cinza super claro */
            background-image: 
                linear-gradient(rgba(220, 38, 38, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(220, 38, 38, 0.1) 1px, transparent 1px);
            color: #18181b;
        }
        
        /* Ajuste de Letras no Modo Claro */
        body.light-mode .text-zinc-100 { color: #18181b !important; }
        body.light-mode .text-zinc-200 { color: #27272a !important; }
        body.light-mode .text-zinc-300 { color: #3f3f46 !important; }
        body.light-mode .text-zinc-400 { color: #52525b !important; }
        body.light-mode .text-zinc-500 { color: #71717a !important; }
        body.light-mode .text-zinc-600 { color: #a1a1aa !important; }

        /* Ajuste dos Vidros (Liquid Glass Claro) */
        body.light-mode .bg-zinc-900\/80 { background-color: rgba(255, 255, 255, 0.8) !important; }
        body.light-mode .bg-zinc-900\/50 { background-color: rgba(255, 255, 255, 0.9) !important; }
        body.light-mode .bg-black\/50 { background-color: rgba(255, 255, 255, 0.6) !important; }
        body.light-mode .bg-black\/40 { background-color: rgba(255, 255, 255, 0.4) !important; }
        body.light-mode .bg-black\/20 { background-color: rgba(255, 255, 255, 0.2) !important; }
        body.light-mode .bg-zinc-800\/80 { background-color: rgba(255, 255, 255, 0.95) !important; }
        body.light-mode .bg-zinc-800 { background-color: #e4e4e7 !important; }
        
        /* Bordas no modo claro */
        body.light-mode .border-white\/10 { border-color: rgba(0,0,0,0.1) !important; }
        body.light-mode .border-white\/5 { border-color: rgba(0,0,0,0.05) !important; }
        body.light-mode .border-zinc-800,
        body.light-mode .border-zinc-700,
        body.light-mode .border-zinc-700\/80,
        body.light-mode .border-zinc-700\/50 { border-color: rgba(0,0,0,0.1) !important; }

        /* Ajustes Visuais Específicos do Modo Claro */
        body.light-mode .to-zinc-900 { --tw-gradient-to: rgba(255, 255, 255, 0.6) !important; }
        body.light-mode input::placeholder { color: #a1a1aa !important; }

        /* Ajustes de Input e Gradiente do Capitão e Trio Completo no Modo Claro */
        body.light-mode .bg-black\/50 { background-color: rgba(255, 255, 255, 0.7) !important; border-color: rgba(0,0,0,0.15) !important; color: #18181b !important; }
        body.light-mode .from-yellow-600\/20 { background-image: linear-gradient(to right, rgba(202, 138, 4, 0.25), rgba(255, 255, 255, 0.85)) !important; }
        body.light-mode .bg-zinc-900\/95 { background-color: rgba(255, 255, 255, 0.95) !important; border-color: rgba(34, 197, 94, 0.4) !important; }

        /* Garantir Leitura do Capitão Amarelo no Fundo Branco */
        body.light-mode .text-yellow-400 { color: #b45309 !important; } /* Amber mais escuro */
        body.light-mode .text-yellow-500 { color: #d97706 !important; } 
    </style>
</head>
<body class="text-zinc-100 font-unbounded selection:bg-red-500/30 overflow-x-hidden transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        
        // Ícones via Lucide globais
        const Icon = ({ name, size = 16, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <span className="inline-flex items-center justify-center"><i data-lucide={name} className={className} style={{ width: size, height: size, display: 'inline-block' }}></i></span>;
        };

        function App() {
            // Estado de Tema Claro / Escuro
            const [isLightMode, setIsLightMode] = useState(false);

            // Estados do Sistema de Batalha
            const [newMcName, setNewMcName] = useState('');
            const [warning, setWarning] = useState('');
            const [availableMCs, setAvailableMCs] = useState([]);
            const [trios, setTrios] = useState({
                0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: []
            });
            const [draggingOverId, setDraggingOverId] = useState(null);
            const [draggedMcId, setDraggedMcId] = useState(null);
            const [draggedSourceId, setDraggedSourceId] = useState(null);

            // Estados de Confirmação (Modais)
            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, mc: null, trioId: null });
            const [confirmTrioRemoval, setConfirmTrioRemoval] = useState({ isOpen: false, trioId: null });

            // Estados do Sorteio e Configurações
            const [isShuffling, setIsShuffling] = useState(false);
            const [countdown, setCountdown] = useState(5);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [configCountdown, setConfigCountdown] = useState(5);
            const [configShuffleSteps, setConfigShuffleSteps] = useState(5);

            // Estado do Modal de Ajuda
            const [isHelpOpen, setIsHelpOpen] = useState(false);

            // Estados de Customização Visual (Header)
            const [titleText, setTitleText] = useState('Batalha da Torre');
            const [titleColor, setTitleColor] = useState('#dc2626'); 
            const [subtitleText, setSubtitleText] = useState('Draft Oficial de Trios');
            const [subtitleColor, setSubtitleColor] = useState('#f2f2f2'); 
            const [logoImg, setLogoImg] = useState(null);
            const [logoZoom, setLogoZoom] = useState(1);

            // Efeito para ativar/desativar a classe na tag Body do site inteiro
            useEffect(() => {
                if (isLightMode) {
                    document.body.classList.add('light-mode');
                } else {
                    document.body.classList.remove('light-mode');
                }
            }, [isLightMode]);

            const sortedAvailableMCs = useMemo(() => {
                return [...availableMCs].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
            }, [availableMCs]);

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setLogoImg(reader.result);
                        setLogoZoom(1);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleAddMc = (e) => {
                e.preventDefault();
                if (!newMcName.trim()) return;
                const newMc = { id: Date.now().toString() + Math.random(), name: newMcName.trim() };
                setAvailableMCs([...availableMCs, newMc]);
                setNewMcName('');
                setWarning('');
            };

            const handleDragStart = (e, mc, sourceId) => {
                setDraggedMcId(mc.id);
                setDraggedSourceId(sourceId);
                e.dataTransfer.setData('text/plain', mc.id);
                e.dataTransfer.effectAllowed = 'move';
            };

            const handleDragOver = (e, targetId) => {
                e.preventDefault();
                if (draggingOverId !== targetId) {
                    setDraggingOverId(targetId);
                }
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                setDraggingOverId(null);
            };

            const handleDrop = (e, targetId) => {
                e.preventDefault();
                setDraggingOverId(null);
                setWarning('');

                const mcId = draggedMcId;
                const sourceId = draggedSourceId;

                if (!mcId || sourceId === targetId.toString()) return;

                let mcToMove = null;
                if (sourceId === 'available') {
                    mcToMove = availableMCs.find(mc => mc.id === mcId);
                } else {
                    mcToMove = trios[sourceId]?.find(mc => mc.id === mcId);
                }

                if (!mcToMove) return;

                if (targetId !== 'available' && trios[targetId].length >= 3) {
                    setWarning(`O Trio ${Number(targetId) + 1} já está completo!`);
                    return;
                }

                if (sourceId === 'available') {
                    setAvailableMCs(prev => prev.filter(mc => mc.id !== mcId));
                } else {
                    setTrios(prev => ({ ...prev, [sourceId]: prev[sourceId].filter(mc => mc.id !== mcId) }));
                }

                if (targetId === 'available') {
                    setAvailableMCs(prev => [...prev, mcToMove]);
                } else {
                    setTrios(prev => ({ ...prev, [targetId]: [...prev[targetId], mcToMove] }));
                }

                setDraggedMcId(null);
                setDraggedSourceId(null);
            };

            const requestRemoval = (mc, trioId, indexInTrio) => {
                setWarning('');
                if (indexInTrio === 0) {
                    setConfirmDialog({ isOpen: true, mc, trioId });
                } else {
                    executeRemoval(mc, trioId);
                }
            };

            const executeRemoval = (mc, sourceTrioId) => {
                setTrios(prev => ({
                    ...prev,
                    [sourceTrioId]: prev[sourceTrioId].filter(item => item.id !== mc.id)
                }));
                setAvailableMCs(prev => [...prev, mc]);
                setConfirmDialog({ isOpen: false, mc: null, trioId: null });
            };

            const executeTrioRemoval = (trioId) => {
                const mcsToReturn = trios[trioId] || [];
                if (mcsToReturn.length > 0) {
                    setAvailableMCs(prev => [...prev, ...mcsToReturn]);
                }
                setTrios(prev => {
                    const newTrios = { ...prev };
                    delete newTrios[trioId];
                    return newTrios;
                });
                setConfirmTrioRemoval({ isOpen: false, trioId: null });
            };

            const handleAddTrio = () => {
                const existingKeys = Object.keys(trios).map(Number);
                const nextIndex = existingKeys.length > 0 ? Math.max(...existingKeys) + 1 : 0;
                setTrios(prev => ({ ...prev, [nextIndex]: [] }));
            };

            const handleCardMouseMove = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                const rotateX = -((y - centerY) / centerY) * 7; 
                const rotateY = ((x - centerX) / centerX) * 7;

                e.currentTarget.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
            };

            const handleCardMouseLeave = (e) => {
                e.currentTarget.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
            };

            const startShuffle = () => {
                setIsShuffling(true);
                setCountdown(configCountdown);

                let currentCount = configCountdown;
                const timer = setInterval(() => {
                    currentCount -= 1;
                    if (currentCount > 0) {
                        setCountdown(currentCount);
                    } else {
                        clearInterval(timer);
                        setCountdown(0);
                        setTimeout(() => {
                            executeShuffle();
                        }, 400);
                    }
                }, 1000);
            };

            const executeShuffle = async () => {
                setIsShuffling(false);

                await new Promise(resolve => setTimeout(resolve, 50));

                let currentTrioValues = Object.values(trios);
                const originalTrioValues = [...currentTrioValues];

                const getDerangement = (currentArray, originalArrayToAvoid) => {
                    if (currentArray.length <= 1) return [...currentArray];
                    let newArray = [...currentArray];
                    let isDerangement = false;
                    let attempts = 0;
                    
                    while (!isDerangement && attempts < 200) {
                        for (let i = newArray.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                        }
                        
                        isDerangement = true;
                        for (let i = 0; i < currentArray.length; i++) {
                            if (newArray[i] === currentArray[i]) {
                                isDerangement = false;
                                break;
                            }
                            if (originalArrayToAvoid && newArray[i] === originalArrayToAvoid[i]) {
                                isDerangement = false;
                                break;
                            }
                        }
                        attempts++;
                    }
                    return newArray;
                };

                for (let step = 1; step <= configShuffleSteps; step++) {
                    await new Promise(resolve => {
                        const isLastStep = step === configShuffleSteps;
                        const nextTrioValues = getDerangement(
                            currentTrioValues, 
                            isLastStep ? originalTrioValues : null
                        );
                        currentTrioValues = nextTrioValues;

                        const applyShuffle = () => {
                            setTrios(() => {
                                const newTrios = {};
                                nextTrioValues.forEach((trio, index) => {
                                    newTrios[index] = trio; 
                                });
                                return newTrios;
                            });
                        };

                        if (document.startViewTransition) {
                            const transition = document.startViewTransition(() => {
                                ReactDOM.flushSync(() => {
                                    applyShuffle();
                                });
                            });
                            transition.finished.then(() => {
                                setTimeout(resolve, isLastStep ? 0 : 400); 
                            });
                        } else {
                            applyShuffle();
                            setTimeout(resolve, 300);
                        }
                    });
                }
            };

            useEffect(() => {
                const handleBeforeUnload = (e) => {
                    e.preventDefault();
                    e.returnValue = ''; 
                };
                window.addEventListener('beforeunload', handleBeforeUnload);
                return () => {
                    window.removeEventListener('beforeunload', handleBeforeUnload);
                };
            }, []);

            return (
                <div className="min-h-screen p-4 md:p-6 pb-20 relative z-10 flex flex-col justify-between">
                    <div>
                        {/* Cabeçalho Editável */}
                        <header className="mb-10 text-center flex flex-col items-center justify-center space-y-3 relative z-10 mt-4">
                            
                            {/* Botão de Tema (Claro/Escuro) */}
                            <button 
                                onClick={() => setIsLightMode(!isLightMode)}
                                className="absolute top-0 left-0 p-2 text-zinc-200 hover:text-zinc-300 transition-colors flex items-center gap-1.5 text-[10px] uppercase tracking-widest font-bold cursor-pointer"
                            >
                                <Icon name={isLightMode ? "moon" : "sun"} size={16} />
                                <span className="hidden sm:inline">{isLightMode ? "Modo Escuro" : "Modo Claro"}</span>
                            </button>

                            {/* Botão de Como Usar */}
                            <button 
                                onClick={() => setIsHelpOpen(true)}
                                className="absolute top-0 right-0 p-2 text-zinc-200 hover:text-zinc-300 transition-colors flex items-center gap-1.5 text-[10px] uppercase tracking-widest font-bold cursor-pointer"
                            >
                                <Icon name="help-circle" size={16} />
                                <span className="hidden sm:inline">Como usar</span>
                            </button>

                            {/* Seção da Logo */}
                            <div className="relative flex flex-col items-center group">
                                <input type="file" id="logoUpload" className="hidden" accept="image/*" onChange={handleImageUpload} />
                                
                                <label htmlFor="logoUpload" title="Clique para alterar a logo" className="relative inline-flex items-center justify-center w-24 h-24 bg-red-600 rounded-full mb-1 shadow-[0_0_20px_rgba(220,38,38,0.5)] cursor-pointer overflow-hidden border-2 border-transparent hover:border-white transition-all">
                                    {logoImg ? (
                                        <img 
                                            src={logoImg} 
                                            alt="Logo Editada" 
                                            style={{ 
                                                transform: `scale(${logoZoom})`, 
                                                objectFit: 'cover', 
                                                width: '100%', 
                                                height: '100%' 
                                            }} 
                                        />
                                    ) : (
                                        <span className="inline-flex items-center justify-center">
                                            <Icon name="swords" size={40} className="text-zinc-50" />
                                        </span>
                                    )}
                                    <div className="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                                        <Icon name="camera" size={24} className="text-white" />
                                    </div>
                                </label>
                                
                                {/* Controle de Zoom da Logo */}
                                {logoImg && (
                                    <div className="absolute -right-8 top-1/2 -translate-y-1/2 translate-x-full flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity bg-zinc-900/90 p-2 rounded-lg border border-zinc-700 backdrop-blur-sm z-20">
                                        <Icon name="zoom-out" size={14} className="text-zinc-400" />
                                        <input 
                                            type="range" min="0.5" max="3" step="0.05" 
                                            value={logoZoom} 
                                            onChange={(e) => setLogoZoom(e.target.value)} 
                                            className="w-20 accent-red-500 cursor-pointer" 
                                        />
                                        <Icon name="zoom-in" size={14} className="text-zinc-400" />
                                    </div>
                                )}
                            </div>

                            {/* Título Editável */}
                            <div className="relative group flex items-center justify-center w-full max-w-2xl">
                                <input 
                                    type="text"
                                    value={titleText}
                                    onChange={(e) => setTitleText(e.target.value)}
                                    style={{ color: titleColor }}
                                    className="text-xl md:text-3xl font-black uppercase tracking-widest bg-transparent border-b border-transparent focus:border-red-500/50 outline-none text-center w-full transition-colors pb-1"
                                />
                                <div className="absolute right-0 translate-x-[120%] opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center z-20">
                                    <label className="text-[9px] text-zinc-500 mb-1">Cor</label>
                                    <input 
                                        type="color" 
                                        value={titleColor} 
                                        onChange={(e) => setTitleColor(e.target.value)}
                                        className="w-8 h-8 rounded cursor-pointer bg-zinc-900 border border-zinc-700 p-0 overflow-hidden" 
                                    />
                                </div>
                            </div>

                            {/* Subtítulo Editável */}
                            <div className="relative group flex items-center justify-center w-full max-w-md">
                                <input 
                                    type="text"
                                    value={subtitleText}
                                    onChange={(e) => setSubtitleText(e.target.value)}
                                    style={{ color: subtitleColor }}
                                    className="text-sm font-medium tracking-wide bg-transparent border-b border-transparent focus:border-zinc-500 outline-none text-center w-full transition-colors pb-1"
                                />
                                <div className="absolute right-0 translate-x-[120%] opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center z-20">
                                    <input 
                                        type="color" 
                                        value={subtitleColor} 
                                        onChange={(e) => setSubtitleColor(e.target.value)}
                                        className="w-5 h-5 rounded cursor-pointer bg-zinc-900 border border-zinc-700 p-0 overflow-hidden" 
                                    />
                                </div>
                            </div>

                            {/* Botão de Sorteio e Configurações */}
                            <div className="mt-5 flex items-center justify-center gap-3 relative z-20">
                                <button 
                                    onClick={startShuffle}
                                    className="px-6 py-2.5 bg-purple-700 hover:bg-purple-600 text-white rounded-full font-bold uppercase tracking-widest text-xs flex items-center justify-center gap-2 transition-all shadow-[0_0_20px_rgba(126,34,206,0.5)] cursor-pointer hover:scale-105"
                                >
                                    <Icon name="shuffle" size={16} />
                                    Sortear Ordem
                                </button>
                                <button 
                                    onClick={() => setIsSettingsOpen(true)}
                                    className="w-10 h-10 flex items-center justify-center bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 rounded-full transition-all shadow-[0_0_15px_rgba(0,0,0,0.2)] cursor-pointer hover:scale-105 border border-zinc-700 backdrop-blur-sm"
                                    title="Configurações do Sorteio"
                                >
                                    <Icon name="settings" size={16} />
                                </button>
                            </div>

                        </header>

                        {/* Alerta de erro */}
                        {warning && (
                            <div className="max-w-md mx-auto mb-6 bg-red-950/80 border border-red-500/50 text-red-200 px-4 py-2 rounded-lg text-center text-sm font-medium animate-pulse backdrop-blur-sm z-20 relative">
                                {warning}
                            </div>
                        )}

                        <div className="max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 relative z-10">
                            
                            {/* Coluna de MCs Disponíveis (LIQUID GLASS + 3D MOUSE) */}
                            <div className="lg:col-span-4 flex flex-col h-auto lg:h-[calc(100vh-280px)]">
                                <div 
                                    className="trio-tilt-card bg-zinc-900/80 backdrop-blur-xl backdrop-saturate-150 border border-white/10 rounded-2xl flex flex-col h-full shadow-[0_8px_32px_rgba(0,0,0,0.3)] overflow-hidden"
                                    onMouseMove={handleCardMouseMove}
                                    onMouseLeave={handleCardMouseLeave}
                                >
                                    <div className="p-4 bg-black/40 border-b border-zinc-800 flex items-center justify-between">
                                        <h2 className="text-sm font-bold flex items-center gap-2 text-zinc-100 uppercase tracking-wider">
                                            <Icon name="users" size={16} className="text-red-500" />
                                            Lista de MC's
                                        </h2>
                                        <span className="bg-red-600/20 border border-red-500/30 text-red-400 text-xs font-bold px-2.5 py-1 rounded-md">
                                            {sortedAvailableMCs.length}
                                        </span>
                                    </div>

                                    <div className="p-3 bg-zinc-900/50 border-b border-zinc-800">
                                        <form onSubmit={handleAddMc} className="flex gap-2">
                                            <input
                                                type="text"
                                                placeholder="Adicionar novo MC..."
                                                value={newMcName}
                                                onChange={(e) => setNewMcName(e.target.value)}
                                                className="w-full bg-black/50 border border-zinc-700 rounded-lg px-3 py-2.5 text-xs font-semibold focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-zinc-100 transition-all placeholder:text-zinc-600"
                                            />
                                            <button 
                                                type="submit"
                                                disabled={!newMcName.trim()}
                                                className="bg-red-800 hover:bg-red-800 disabled:opacity-50 text-white px-4 py-2 rounded-lg transition-colors cursor-pointer shadow-lg shadow-red-600/20 flex-shrink-0"
                                            >
                                                <Icon name="plus" size={18} />
                                            </button>
                                        </form>
                                    </div>

                                    <div 
                                        className={`flex-1 p-4 overflow-y-auto content-start flex flex-wrap gap-2 transition-colors ${
                                            draggingOverId === 'available' ? 'bg-zinc-800/80 ring-2 ring-inset ring-red-500/50' : ''
                                        }`}
                                        onDragOver={(e) => handleDragOver(e, 'available')}
                                        onDragLeave={handleDragLeave}
                                        onDrop={(e) => handleDrop(e, 'available')}
                                    >
                                        {sortedAvailableMCs.length === 0 ? (
                                            <div className="w-full h-40 flex flex-col items-center justify-center text-zinc-200 space-y-3 opacity-50">
                                                <Icon name="mic-2" size={32} />
                                                <p className="text-xs font-medium text-center uppercase tracking-widest">Lista Vazia</p>
                                            </div>
                                        ) : (
                                            sortedAvailableMCs.map((mc) => (
                                                <div
                                                    key={mc.id}
                                                    draggable
                                                    onDragStart={(e) => handleDragStart(e, mc, 'available')}
                                                    style={{ viewTransitionName: `mc-${mc.id.toString().replace(/[^a-zA-Z0-9]/g, '')}` }}
                                                    className="group flex items-center gap-1.5 px-3 py-1.5 bg-zinc-800/80 border border-zinc-700/80 rounded-full cursor-grab active:cursor-grabbing hover:border-red-500 hover:bg-zinc-800 hover:shadow-[0_0_10px_rgba(239,68,68,0.2)] transition-all"
                                                >
                                                    <Icon name="mic-2" size={10} className="text-zinc-500 group-hover:text-red-400 transition-colors" />
                                                    <span className="font-bold text-[10px] md:text-xs text-zinc-200 uppercase whitespace-nowrap tracking-wide">{mc.name}</span>
                                                    <button
                                                        onClick={() => setAvailableMCs(prev => prev.filter(m => m.id !== mc.id))}
                                                        className="opacity-0 group-hover:opacity-100 ml-1 p-0.5 rounded-full hover:bg-red-500 hover:text-white text-zinc-500 transition-all cursor-pointer"
                                                        title="Excluir MC da lista"
                                                    >
                                                        <Icon name="x" size={10} />
                                                    </button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Colunas dos Trios (LIQUID GLASS MANTIDO) */}
                            <div className="lg:col-span-8">
                                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5 h-full content-start pb-10">
                                    {Object.keys(trios).map((trioIndex) => {
                                        const numIndex = parseInt(trioIndex);
                                        const trioMCs = trios[numIndex];
                                        const count = trioMCs.length;
                                        const isOver = draggingOverId === numIndex;

                                        let borderColor = 'border-transparent bg-zinc-900/80 border-dashed';
                                        if (count > 0 && count < 3) borderColor = 'border-yellow-500/50 bg-zinc-900/80 border-solid shadow-[0_0_20px_rgba(234,179,8,0.25)]';
                                        if (count === 3) borderColor = 'border-green-500/50 bg-zinc-900/95 border-solid shadow-[0_0_20px_rgba(34,197,94,0.25)]';

                                        return (
                                            <div
                                                key={trioIndex}
                                                onDragOver={(e) => handleDragOver(e, numIndex)}
                                                onDragLeave={handleDragLeave}
                                                onDrop={(e) => handleDrop(e, numIndex)}
                                                onMouseMove={handleCardMouseMove}
                                                onMouseLeave={handleCardMouseLeave}
                                                className={`trio-tilt-card relative flex flex-col rounded-2xl border-2 backdrop-blur-xl backdrop-saturate-150 shadow-[0_8px_32px_rgba(0,0,0,0.2)] ${borderColor} ${
                                                    isOver ? 'ring-2 ring-yellow-400 scale-[1.02] bg-zinc-800' : ''
                                                }`}
                                            >
                                                <div className="p-3 border-b border-white/5 flex justify-between items-center bg-black/20 rounded-t-xl">
                                                    <h3 className="font-black text-sm text-zinc-100 tracking-wider">Trio {numIndex + 1}</h3>
                                                    <div className="flex items-center gap-2">
                                                        <span className={`text-[10px] font-black px-2 py-1 rounded-md ${
                                                            count === 3 ? 'bg-green-500/20 text-green-400' : 'bg-black/40 text-zinc-400 border border-white/5'
                                                        }`}>
                                                            {count}/3
                                                        </span>
                                                        <button 
                                                            onClick={() => setConfirmTrioRemoval({ isOpen: true, trioId: trioIndex })}
                                                            className="p-1.5 rounded-md text-zinc-500 hover:text-red-400 hover:bg-red-500/10 transition-colors cursor-pointer"
                                                            title="Remover Trio"
                                                        >
                                                            <Icon name="x" size={14} />
                                                        </button>
                                                    </div>
                                                </div>

                                                <div className="p-2 flex-1 flex flex-col gap-2 min-h-[160px]">
                                                    {trioMCs.map((mc, index) => {
                                                        const isCaptain = index === 0;
                                                        return (
                                                            <div
                                                                key={mc.id}
                                                                draggable
                                                                onDragStart={(e) => handleDragStart(e, mc, trioIndex)}
                                                                onClick={() => requestRemoval(mc, numIndex, index)}
                                                                style={{ viewTransitionName: `mc-${mc.id.toString().replace(/[^a-zA-Z0-9]/g, '')}` }}
                                                                title="Clique para remover"
                                                                className={`group relative overflow-hidden flex items-center p-2.5 h-[46px] rounded-lg cursor-pointer transition-all ${
                                                                    isCaptain 
                                                                        ? 'bg-gradient-to-r from-yellow-600/20 to-zinc-900 border border-yellow-500/50 shadow-[0_0_10px_rgba(234,179,8,0.2)] hover:border-red-500 hover:from-red-900/30' 
                                                                        : 'bg-black/40 border border-zinc-700/50 hover:border-red-500 hover:bg-red-950/30'
                                                                }`}
                                                            >
                                                                <div className="flex-1 flex items-center gap-2.5 relative z-10 w-full overflow-hidden">
                                                                    <div className={`w-6 h-6 shrink-0 rounded-full flex items-center justify-center ${
                                                                        isCaptain ? 'bg-yellow-500/20 text-yellow-500' : 'bg-zinc-800 text-zinc-400'
                                                                    }`}>
                                                                        <Icon name={isCaptain ? "crown" : "mic-2"} size={12} />
                                                                    </div>
                                                                    <span className={`text-xs font-black uppercase truncate tracking-wide ${
                                                                        isCaptain ? 'text-yellow-400 drop-shadow-[0_0_5px_rgba(234,179,8,0.3)]' : 'text-zinc-200'
                                                                    }`}>
                                                                        {mc.name}
                                                                    </span>
                                                                </div>
                                                                <div className="opacity-0 group-hover:opacity-100 transition-opacity bg-red-600 rounded p-1 absolute right-2 z-10">
                                                                    <Icon name="x" size={12} className="text-white" />
                                                                </div>
                                                            </div>
                                                        );
                                                    })}

                                                    {/* Espaços Vazios Fixos (Mantém o tamanho exato) */}
                                                    {Array.from({ length: Math.max(0, 3 - count) }).map((_, i) => {
                                                        const isCaptainSlot = count === 0 && i === 0;
                                                        return (
                                                            <div 
                                                                key={`empty-${i}`} 
                                                                className={`w-full h-[46px] shrink-0 border border-dashed rounded-lg flex flex-col items-center justify-center transition-colors ${
                                                                    isCaptainSlot 
                                                                        ? 'border-yellow-500/40 bg-yellow-500/5 shadow-[0_0_15px_rgba(234,179,8,0.1)_inset]' 
                                                                        : 'border-zinc-700/50 bg-black/20'
                                                                }`}
                                                            >
                                                                <span className={`text-[9px] font-black uppercase tracking-[0.2em] ${
                                                                    isCaptainSlot ? 'text-yellow-600/70' : 'text-zinc-600'
                                                                }`}>
                                                                    {isCaptainSlot ? 'Espaço Capitão(ã)' : 'Espaço Vazio'}
                                                                </span>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}

                                    {/* Botão para Adicionar Novo Trio */}
                                    <button 
                                        onClick={handleAddTrio}
                                        className="trio-tilt-card relative flex flex-col rounded-2xl border-2 border-dashed border-zinc-700/50 bg-black/20 hover:bg-zinc-800/50 hover:border-zinc-600 transition-all min-h-[220px] items-center justify-center group cursor-pointer backdrop-blur-sm"
                                        onMouseMove={handleCardMouseMove}
                                        onMouseLeave={handleCardMouseLeave}
                                    >
                                        <div className="w-16 h-16 rounded-full bg-zinc-800/80 flex items-center justify-center group-hover:bg-zinc-700 group-hover:scale-110 transition-all shadow-lg">
                                            <Icon name="plus" size={32} className="text-zinc-500 group-hover:text-zinc-300 transition-colors" />
                                        </div>
                                        <span className="text-zinc-500 font-bold mt-4 uppercase tracking-[0.2em] text-[10px] group-hover:text-zinc-300 transition-colors">
                                            Adicionar Trio
                                        </span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Rodapé Oficial */}
                    <footer className="mt-12 text-center text-xs text-zinc-200 relative z-10 py-4 border-t border-white/5">
                        <p>Criado por Vitor Carvalho. Sugestões? Fale comigo no instagram: <a href="https://www.instagram.com/ovitorcarvalho/" target="_blank" rel="noopener noreferrer" className="text-red-500 hover:underline font-bold">@ovitorcarvalho</a></p>
                    </footer>

                    {/* Modais */}
                    
                    {/* Modal Capitão */}
                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/40 backdrop-blur-md">
                            <div className="animate-modal-pop bg-zinc-900/80 backdrop-blur-xl backdrop-saturate-150 border border-white/10 p-6 rounded-2xl max-w-sm w-full shadow-[0_8px_32px_rgba(0,0,0,0.4)] relative text-center border-t-4 border-t-yellow-500">
                                <div className="w-16 h-16 bg-yellow-500/15 rounded-full flex items-center justify-center border border-yellow-500/20 text-yellow-500 mx-auto mb-4 mt-2">
                                    <Icon name="alert-triangle" size={32} />
                                </div>
                                <h2 className="text-lg font-black uppercase tracking-wider text-zinc-100">Remover Capitão(ã)?</h2>
                                <p className="text-sm text-zinc-400 mt-2 leading-relaxed">Você deseja remover <strong className="text-yellow-400">{confirmDialog.mc?.name}</strong> do posto de capitão(ã) do Trio {Number(confirmDialog.trioId) + 1}?</p>
                                
                                <div className="flex gap-3 w-full mt-6">
                                    <button onClick={() => setConfirmDialog({ isOpen: false, mc: null, trioId: null })} className="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-bold uppercase rounded-lg cursor-pointer transition-colors">Cancelar</button>
                                    <button onClick={() => executeRemoval(confirmDialog.mc, confirmDialog.trioId)} className="flex-1 py-3 bg-red-600 hover:bg-red-500 text-white text-xs font-bold uppercase rounded-lg cursor-pointer shadow-[0_0_15px_rgba(220,38,38,0.4)] transition-all">Remover</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Remover Trio */}
                    {confirmTrioRemoval.isOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/40 backdrop-blur-md">
                            <div className="animate-modal-pop bg-zinc-900/80 backdrop-blur-xl backdrop-saturate-150 border border-white/10 p-6 rounded-2xl max-w-sm w-full shadow-[0_8px_32px_rgba(0,0,0,0.4)] relative text-center border-t-4 border-t-red-600">
                                <div className="w-16 h-16 bg-red-500/15 rounded-full flex items-center justify-center border border-red-500/20 text-red-500 mx-auto mb-4 mt-2">
                                    <Icon name="trash-2" size={32} />
                                </div>
                                <h2 className="text-lg font-black uppercase tracking-wider text-zinc-100">Excluir Trio?</h2>
                                <p className="text-sm text-zinc-400 mt-2 leading-relaxed">Deseja remover o <strong className="text-red-400">Trio {Number(confirmTrioRemoval.trioId) + 1}</strong>? Os MCs que estiverem nele voltarão para a lista geral.</p>
                                
                                <div className="flex gap-3 w-full mt-6">
                                    <button onClick={() => setConfirmTrioRemoval({ isOpen: false, trioId: null })} className="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-bold uppercase rounded-lg cursor-pointer transition-colors">Cancelar</button>
                                    <button onClick={() => executeTrioRemoval(confirmTrioRemoval.trioId)} className="flex-1 py-3 bg-red-600 hover:bg-red-500 text-white text-xs font-bold uppercase rounded-lg cursor-pointer shadow-[0_0_15px_rgba(220,38,38,0.4)] transition-all">Excluir</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Sorteio (Contagem Regressiva) - Animado */}
                    {isShuffling && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/40 backdrop-blur-md">
                            <div className="animate-modal-pop text-center flex flex-col items-center">
                                <Icon name="shuffle" size={48} className="text-purple-500 mb-6 animate-pulse" />
                                <h2 className="text-xl md:text-3xl font-black uppercase tracking-[0.3em] text-zinc-100 mb-8 animate-pulse">Sorteando a Ordem</h2>
                                <div className="text-[150px] leading-none font-black text-transparent bg-clip-text bg-gradient-to-b from-purple-400 to-purple-800">
                                    {countdown}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Configurações do Sorteio */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-black/40 backdrop-blur-md">
                            <div 
                                className="trio-tilt-card animate-modal-pop bg-zinc-900/80 backdrop-blur-xl backdrop-saturate-150 border border-white/10 p-6 md:p-8 rounded-2xl max-w-sm w-full shadow-[0_8px_32px_rgba(0,0,0,0.4)] relative"
                                onMouseMove={handleCardMouseMove}
                                onMouseLeave={handleCardMouseLeave}
                            >
                                <button 
                                    onClick={() => setIsSettingsOpen(false)}
                                    className="absolute top-4 right-4 text-zinc-500 hover:text-zinc-300 transition-colors cursor-pointer p-1"
                                >
                                    <Icon name="x" size={20} />
                                </button>
                                
                                <div className="flex items-center gap-3 mb-6">
                                    <div className="w-12 h-12 bg-zinc-500/15 rounded-full flex items-center justify-center border border-zinc-500/20 text-zinc-300">
                                        <Icon name="settings" size={24} />
                                    </div>
                                    <h2 className="text-lg font-black uppercase tracking-wider text-zinc-100">Sorteio</h2>
                                </div>
                                
                                <div className="space-y-6 text-xs md:text-sm text-zinc-400">
                                    <div className="flex flex-col gap-2">
                                        <label className="font-bold text-zinc-200 uppercase tracking-wider text-[10px]">Segundos da Contagem: <span className="text-purple-400 text-xs">{configCountdown}s</span></label>
                                        <input 
                                            type="range" min="1" max="15" step="1" 
                                            value={configCountdown} 
                                            onChange={(e) => setConfigCountdown(Number(e.target.value))} 
                                            className="w-full accent-purple-500 cursor-pointer" 
                                        />
                                    </div>

                                    <div className="flex flex-col gap-2">
                                        <label className="font-bold text-zinc-200 uppercase tracking-wider text-[10px]">Quantidade de mudanças de ordem: <span className="text-purple-400 text-xs">{configShuffleSteps}x</span></label>
                                        <input 
                                            type="range" min="1" max="10" step="1" 
                                            value={configShuffleSteps} 
                                            onChange={(e) => setConfigShuffleSteps(Number(e.target.value))} 
                                            className="w-full accent-purple-500 cursor-pointer" 
                                        />
                                    </div>
                                </div>
                                
                                <button 
                                    onClick={() => setIsSettingsOpen(false)} 
                                    className="w-full mt-8 py-3 bg-purple-700 hover:bg-purple-600 text-white text-xs font-bold uppercase rounded-lg cursor-pointer transition-colors shadow-[0_0_15px_rgba(126,34,206,0.3)]"
                                >
                                    Salvar e Fechar
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Modal Como Usar */}
                    {isHelpOpen && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-black/40 backdrop-blur-md">
                            <div 
                                className="trio-tilt-card animate-modal-pop bg-zinc-900/80 backdrop-blur-xl backdrop-saturate-150 border border-white/10 p-6 md:p-8 rounded-2xl max-w-xl w-full shadow-[0_8px_32px_rgba(0,0,0,0.4)] relative"
                                onMouseMove={handleCardMouseMove}
                                onMouseLeave={handleCardMouseLeave}
                            >
                                <button 
                                    onClick={() => setIsHelpOpen(false)}
                                    className="absolute top-4 right-4 text-zinc-500 hover:text-zinc-300 transition-colors cursor-pointer p-1"
                                >
                                    <Icon name="x" size={20} />
                                </button>
                                
                                <div className="flex items-center gap-3 mb-6">
                                    <div className="w-12 h-12 bg-blue-500/15 rounded-full flex items-center justify-center border border-blue-500/20 text-blue-500">
                                        <Icon name="info" size={24} />
                                    </div>
                                    <h2 className="text-lg md:text-xl font-black uppercase tracking-wider text-zinc-100">Como usar o site</h2>
                                </div>
                                
                                <div className="space-y-4 text-xs md:text-sm text-zinc-400 leading-relaxed overflow-y-auto max-h-[60vh] pr-2">
                                    <p><strong className="text-zinc-200">1. Adicionar MC's:</strong> Digite o nome do MC na barra lateral e clique no "+" ou aperte "Enter".</p>
                                    <p><strong className="text-yellow-400">2. Capitães (Cor Dourada):</strong> Arraste o MC para o 1º espaço de qualquer trio para marcá-lo como Capitão.</p>
                                    <p><strong className="text-green-400">3. Formar Trios:</strong> Arraste os outros MC's para preencher as caixas. Com as 3 pessoas, a borda ficará verde indicando que o trio está completo.</p>
                                    <p><strong className="text-purple-400">4. Sortear Ordem:</strong> Clique no botão roxo no topo. Ele embaralhará todos os trios para novas posições aleatórias. Ideal ser usado após definir os capitães para sortear a ordem de escolha.</p>
                                    <p><strong className="text-blue-400">5. Customizar:</strong> Clique no Título "Batalha da Torre" e no Subtítulo para editá-los e mudar a cor. Clique na Logo para alterar a imagem.</p>
                                    <p><strong className="text-red-600">6. Excluir:</strong> Clique no nome do MC ou no "X" para exclui-lo do trio, o nome voltará para a lista geral.</p>
                                </div>
                                
                                <button 
                                    onClick={() => setIsHelpOpen(false)} 
                                    className="w-full mt-8 py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-bold uppercase rounded-lg cursor-pointer transition-colors"
                                >
                                    Entendi
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
