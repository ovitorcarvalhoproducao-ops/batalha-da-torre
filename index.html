<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalha da Torre - Draft Oficial</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Unbounded -->
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        .font-unbounded { font-family: 'Unbounded', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-unbounded selection:bg-red-500/30 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        
        // Ícones via Lucide globais
        const Icon = ({ name, size = 16, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size, display: 'inline-block' }}></i>;
        };

        function App() {
            const [newMcName, setNewMcName] = useState('');
            const [warning, setWarning] = useState('');
            const [availableMCs, setAvailableMCs] = useState([]);
            const [trios, setTrios] = useState({
                0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: []
            });
            const [draggingOverId, setDraggingOverId] = useState(null);
            const [draggedMcId, setDraggedMcId] = useState(null);
            const [draggedSourceId, setDraggedSourceId] = useState(null);

            const [isAdminOpen, setIsAdminOpen] = useState(false);
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [adminLoginError, setAdminLoginError] = useState('');

            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, mc: null, trioId: null });
            const [confirmTrioRemoval, setConfirmTrioRemoval] = useState({ isOpen: false, trioId: null });

            const sortedAvailableMCs = useMemo(() => {
                return [...availableMCs].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
            }, [availableMCs]);

            const handleAddMc = (e) => {
                e.preventDefault();
                if (!newMcName.trim()) return;
                const newMc = { id: Date.now().toString() + Math.random(), name: newMcName.trim() };
                setAvailableMCs([...availableMCs, newMc]);
                setNewMcName('');
                setWarning('');
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPassword === 'torre2026') {
                    setIsAdminLoggedIn(true);
                    setAdminLoginError('');
                    setAdminPassword('');
                } else {
                    setAdminLoginError('Senha incorreta!');
                }
            };

            const handleDragStart = (e, mc, sourceId) => {
                setDraggedMcId(mc.id);
                setDraggedSourceId(sourceId);
                e.dataTransfer.setData('text/plain', mc.id);
            };

            const handleDragOver = (e, targetId) => {
                e.preventDefault();
                if (draggingOverId !== targetId) {
                    setDraggingOverId(targetId);
                }
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                setDraggingOverId(null);
            };

            const handleDrop = (e, targetId) => {
                e.preventDefault();
                setDraggingOverId(null);
                setWarning('');

                const mcId = draggedMcId;
                const sourceId = draggedSourceId;

                if (!mcId || sourceId === targetId.toString()) return;

                let mcToMove = null;
                if (sourceId === 'available') {
                    mcToMove = availableMCs.find(mc => mc.id === mcId);
                } else {
                    mcToMove = trios[sourceId]?.find(mc => mc.id === mcId);
                }

                if (!mcToMove) return;

                if (targetId !== 'available' && trios[targetId].length >= 3) {
                    setWarning(`O Trio ${Number(targetId) + 1} já está completo!`);
                    return;
                }

                if (sourceId === 'available') {
                    setAvailableMCs(prev => prev.filter(mc => mc.id !== mcId));
                } else {
                    setTrios(prev => ({ ...prev, [sourceId]: prev[sourceId].filter(mc => mc.id !== mcId) }));
                }

                if (targetId === 'available') {
                    setAvailableMCs(prev => [...prev, mcToMove]);
                } else {
                    setTrios(prev => ({ ...prev, [targetId]: [...prev[targetId], mcToMove] }));
                }

                setDraggedMcId(null);
                setDraggedSourceId(null);
            };

            const requestRemoval = (mc, trioId, indexInTrio) => {
                setWarning('');
                if (indexInTrio === 0) {
                    setConfirmDialog({ isOpen: true, mc, trioId });
                } else {
                    executeRemoval(mc, trioId);
                }
            };

            const executeRemoval = (mc, sourceTrioId) => {
                setTrios(prev => ({
                    ...prev,
                    [sourceTrioId]: prev[sourceTrioId].filter(item => item.id !== mc.id)
                }));
                setAvailableMCs(prev => [...prev, mc]);
                setConfirmDialog({ isOpen: false, mc: null, trioId: null });
            };

            const executeTrioRemoval = (trioId) => {
                const mcsToReturn = trios[trioId] || [];
                if (mcsToReturn.length > 0) {
                    setAvailableMCs(prev => [...prev, ...mcsToReturn]);
                }
                setTrios(prev => {
                    const newTrios = { ...prev };
                    delete newTrios[trioId];
                    return newTrios;
                });
                setConfirmTrioRemoval({ isOpen: false, trioId: null });
            };

            const handleAddTrio = () => {
                const existingKeys = Object.keys(trios).map(Number);
                const nextIndex = existingKeys.length > 0 ? Math.max(...existingKeys) + 1 : 0;
                setTrios(prev => ({ ...prev, [nextIndex]: [] }));
            };

            useEffect(() => {
                lucide.createIcons();
            });

            return (
                <div className="min-h-screen bg-zinc-950 text-zinc-100 p-4 md:p-6">
                    {/* Header */}
                    <header className="mb-8 text-center flex flex-col items-center justify-center space-y-2 relative">
                        <button 
                            onClick={() => setIsAdminOpen(true)}
                            className="absolute right-0 top-0 bg-zinc-900 border border-zinc-800 hover:border-zinc-700 text-zinc-400 hover:text-zinc-200 px-3 py-2 rounded-xl text-xs flex items-center gap-2 transition-colors shadow-lg cursor-pointer"
                        >
                            <Icon name="shield" size={14} className="text-red-500" />
                            <span className="hidden sm:inline">Painel Admin</span>
                        </button>

                        <div className="inline-flex items-center justify-center p-3 bg-red-600 rounded-full mb-1 shadow-[0_0_20px_rgba(220,38,38,0.5)]">
                            <Icon name="swords" size={28} className="text-zinc-50" />
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black uppercase tracking-widest bg-gradient-to-r from-red-500 via-yellow-500 to-red-500 text-transparent bg-clip-text">
                            Batalha da Torre
                        </h1>
                        <p className="text-zinc-400 text-sm font-medium tracking-wide">Draft Oficial de Trios</p>
                    </header>

                    {warning && (
                        <div className="max-w-md mx-auto mb-6 bg-red-950/50 border border-red-500/50 text-red-200 px-4 py-2 rounded-lg text-center text-sm font-medium animate-pulse">
                            {warning}
                        </div>
                    )}

                    <div className="max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
                        {/* Lista Disponíveis */}
                        <div className="lg:col-span-4 flex flex-col h-auto lg:h-[calc(100vh-180px)]">
                            <div className="bg-zinc-900/80 border border-zinc-800 rounded-2xl flex flex-col h-full shadow-2xl overflow-hidden backdrop-blur-sm">
                                <div className="p-3 bg-zinc-900 border-b border-zinc-800 flex items-center justify-between">
                                    <h2 className="text-sm font-bold flex items-center gap-2 text-zinc-100">
                                        <Icon name="users" size={16} className="text-red-500" />
                                        MCs Disponíveis
                                    </h2>
                                    <span className="bg-zinc-800 text-xs font-bold px-2 py-1 rounded-md text-zinc-400">
                                        {sortedAvailableMCs.length}
                                    </span>
                                </div>

                                <div className="p-3 bg-zinc-800/30 border-b border-zinc-800">
                                    <form onSubmit={handleAddMc} className="flex gap-2">
                                        <input
                                            type="text"
                                            placeholder="Nome do MC..."
                                            value={newMcName}
                                            onChange={(e) => setNewMcName(e.target.value)}
                                            className="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-red-500 text-zinc-100"
                                        />
                                        <button 
                                            type="submit"
                                            disabled={!newMcName.trim()}
                                            className="bg-red-600 hover:bg-red-500 disabled:opacity-50 text-white p-2 rounded-lg transition-colors cursor-pointer"
                                        >
                                            <Icon name="plus" size={16} />
                                        </button>
                                    </form>
                                </div>

                                <div 
                                    className={`flex-1 p-3 overflow-y-auto content-start flex flex-wrap gap-1.5 transition-colors ${
                                        draggingOverId === 'available' ? 'bg-zinc-800/50 ring-2 ring-inset ring-red-500/50' : ''
                                    }`}
                                    onDragOver={(e) => handleDragOver(e, 'available')}
                                    onDragLeave={handleDragLeave}
                                    onDrop={(e) => handleDrop(e, 'available')}
                                >
                                    {sortedAvailableMCs.length === 0 ? (
                                        <div className="w-full h-32 flex flex-col items-center justify-center text-zinc-600 space-y-2">
                                            <Icon name="mic-2" size={24} />
                                            <p className="text-xs text-center">Nenhum MC na lista.</p>
                                        </div>
                                    ) : (
                                        sortedAvailableMCs.map((mc) => (
                                            <div
                                                key={mc.id}
                                                draggable
                                                onDragStart={(e) => handleDragStart(e, mc, 'available')}
                                                className="flex items-center gap-1 px-2.5 py-1 bg-zinc-800 border border-zinc-700 rounded-full cursor-grab active:cursor-grabbing hover:border-red-500 transition-colors shadow-sm"
                                            >
                                                <Icon name="mic-2" size={10} className="text-zinc-400" />
                                                <span className="font-semibold text-[10px] text-zinc-200 uppercase whitespace-nowrap">{mc.name}</span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Trios */}
                        <div className="lg:col-span-8">
                            <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 h-full content-start">
                                {Object.keys(trios).map((trioIndex) => {
                                    const numIndex = parseInt(trioIndex);
                                    const trioMCs = trios[numIndex];
                                    const count = trioMCs.length;
                                    const isOver = draggingOverId === numIndex;

                                    let borderColor = 'border-transparent bg-zinc-900/40 border-dashed';
                                    if (count > 0 && count < 3) borderColor = 'border-yellow-500/80 bg-zinc-900/60 border-solid shadow-[0_0_15px_rgba(234,179,8,0.15)]';
                                    if (count === 3) borderColor = 'border-green-500/80 bg-zinc-900/80 border-solid shadow-[0_0_15px_rgba(34,197,94,0.15)]';

                                    return (
                                        <div
                                            key={trioIndex}
                                            onDragOver={(e) => handleDragOver(e, numIndex)}
                                            onDragLeave={handleDragLeave}
                                            onDrop={(e) => handleDrop(e, numIndex)}
                                            className={`relative flex flex-col rounded-2xl border-2 transition-all duration-300 ${borderColor} ${
                                                isOver ? 'ring-2 ring-yellow-400 scale-[1.02]' : ''
                                            }`}
                                        >
                                            <div className="p-3 border-b border-zinc-800/50 flex justify-between items-center">
                                                <h3 className="font-black text-sm text-zinc-100">Trio {numIndex + 1}</h3>
                                                <div className="flex items-center gap-2">
                                                    <span className={`text-[10px] font-bold px-2 py-1 rounded-md ${
                                                        count === 3 ? 'bg-green-500/20 text-green-400' : 'bg-zinc-800 text-zinc-400'
                                                    }`}>
                                                        {count}/3
                                                    </span>
                                                    <button 
                                                        onClick={() => setConfirmTrioRemoval({ isOpen: true, trioId: trioIndex })}
                                                        className="p-1 rounded-md text-zinc-500 hover:text-red-500 hover:bg-red-500/10 transition-colors cursor-pointer"
                                                        title="Remover Trio"
                                                    >
                                                        <Icon name="x" size={14} />
                                                    </button>
                                                </div>
                                            </div>

                                            <div className="p-2 flex-1 flex flex-col gap-2">
                                                {trioMCs.map((mc, index) => {
                                                    const isCaptain = index === 0;
                                                    return (
                                                        <div
                                                            key={mc.id}
                                                            draggable
                                                            onDragStart={(e) => handleDragStart(e, mc, trioIndex)}
                                                            onClick={() => requestRemoval(mc, numIndex, index)}
                                                            title="Clique para remover"
                                                            className={`group relative overflow-hidden flex items-center p-2 rounded-lg cursor-pointer transition-all shadow-md ${
                                                                isCaptain 
                                                                    ? 'bg-gradient-to-r from-yellow-600/20 to-zinc-800/80 border border-yellow-500/50 shadow-[0_0_10px_rgba(234,179,8,0.3)] hover:border-red-500' 
                                                                    : 'bg-zinc-800/80 border border-zinc-700 hover:border-red-500 hover:bg-red-950/30'
                                                            }`}
                                                        >
                                                            <div className="flex-1 flex items-center gap-2 relative z-10">
                                                                <div className={`w-6 h-6 rounded-full flex items-center justify-center ${
                                                                    isCaptain ? 'bg-yellow-500/20 text-yellow-500' : 'bg-zinc-900 border border-zinc-700 text-zinc-400'
                                                                }`}>
                                                                    <Icon name={isCaptain ? "crown" : "mic-2"} size={12} />
                                                                </div>
                                                                <span className={`text-xs font-bold uppercase truncate ${
                                                                    isCaptain ? 'text-yellow-400' : 'text-zinc-200'
                                                                }`}>
                                                                    {mc.name}
                                                                </span>
                                                            </div>
                                                            <div className="opacity-0 group-hover:opacity-100 transition-opacity bg-red-600 rounded p-1 absolute right-2 z-10">
                                                                <Icon name="x" size={12} className="text-white" />
                                                            </div>
                                                        </div>
                                                    );
                                                })}

                                                {Array.from({ length: Math.max(0, 3 - count) }).map((_, i) => {
                                                    const isCaptainSlot = count === 0 && i === 0;
                                                    return (
                                                        <div 
                                                            key={`empty-${i}`} 
                                                            className={`w-full h-[46px] shrink-0 border border-dashed rounded-lg flex flex-col items-center justify-center ${
                                                                isCaptainSlot 
                                                                    ? 'border-yellow-500/40 bg-yellow-500/5 shadow-[0_0_15px_rgba(234,179,8,0.1)_inset]' 
                                                                    : 'border-zinc-700/50 bg-zinc-900/30'
                                                            }`}
                                                        >
                                                            <span className={`text-[9px] font-bold uppercase tracking-widest ${
                                                                isCaptainSlot ? 'text-yellow-600/70' : 'text-zinc-600'
                                                            }`}>
                                                                {isCaptainSlot ? 'Espaço Capitão(ã)' : 'Espaço Vazio'}
                                                            </span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}

                                <button 
                                    onClick={handleAddTrio}
                                    className="relative flex flex-col rounded-2xl border-2 border-dashed border-zinc-700/50 bg-zinc-900/30 hover:bg-zinc-800/50 hover:border-zinc-600 transition-all min-h-[220px] items-center justify-center group cursor-pointer"
                                >
                                    <div className="w-16 h-16 rounded-full bg-zinc-800/80 flex items-center justify-center group-hover:bg-zinc-700 transition-colors">
                                        <Icon name="plus" size={32} className="text-zinc-500 group-hover:text-zinc-300" />
                                    </div>
                                    <span className="text-zinc-500 font-bold mt-4 uppercase tracking-widest text-xs group-hover:text-zinc-300">
                                        Adicionar Trio
                                    </span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Modal Admin */}
                    {isAdminOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl max-w-md w-full shadow-2xl relative">
                                <button onClick={() => { setIsAdminOpen(false); setAdminLoginError(''); }} className="absolute top-4 right-4 text-zinc-400 hover:text-white cursor-pointer">
                                    <Icon name="x" size={20} />
                                </button>

                                {!isAdminLoggedIn ? (
                                    <form onSubmit={handleAdminLogin} className="flex flex-col items-center space-y-4 pt-2">
                                        <div className="w-14 h-14 bg-red-600/15 rounded-full flex items-center justify-center border border-red-500/20 text-red-500 mb-1">
                                            <Icon name="lock" size={24} />
                                        </div>
                                        <h2 className="text-lg font-bold text-zinc-100">Área Restrita</h2>
                                        <p className="text-xs text-zinc-400 text-center">Digite a senha de administrador (padrão: <code>torre2026</code>).</p>

                                        <input 
                                            type="password"
                                            placeholder="Senha..."
                                            value={adminPassword}
                                            onChange={(e) => setAdminPassword(e.target.value)}
                                            className="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-red-500 text-zinc-100"
                                        />

                                        {adminLoginError && <span className="text-xs text-red-500">{adminLoginError}</span>}

                                        <button type="submit" className="w-full py-3 bg-red-600 hover:bg-red-500 text-white text-xs font-bold uppercase rounded-lg transition-colors cursor-pointer">
                                            Entrar
                                        </button>
                                    </form>
                                ) : (
                                    <div className="flex flex-col space-y-4 pt-2">
                                        <div className="flex items-center gap-3 border-b border-zinc-800 pb-3">
                                            <div className="w-10 h-10 bg-green-500/15 rounded-full flex items-center justify-center text-green-500">
                                                <Icon name="unlock" size={20} />
                                            </div>
                                            <div>
                                                <h2 className="text-sm font-bold text-zinc-100">Painel do Organizador</h2>
                                                <p className="text-[10px] text-green-400">Acesso autorizado</p>
                                            </div>
                                        </div>

                                        <div className="bg-zinc-950 border border-zinc-800 p-3 rounded-xl flex items-center justify-between">
                                            <div>
                                                <p className="text-xs font-bold text-zinc-200">Limpar todos os Trios</p>
                                                <p className="text-[10px] text-zinc-500">Retorna todos os MCs para a lista geral</p>
                                            </div>
                                            <button 
                                                onClick={() => {
                                                    let allMcs = [...availableMCs];
                                                    Object.values(trios).forEach(t => allMcs.push(...t));
                                                    setAvailableMCs(allMcs);
                                                    setTrios({ 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [] });
                                                    setIsAdminOpen(false);
                                                }}
                                                className="bg-zinc-800 hover:bg-red-600/20 text-zinc-300 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors cursor-pointer"
                                            >
                                                Resetar
                                            </button>
                                        </div>

                                        <button onClick={() => setIsAdminLoggedIn(false)} className="w-full mt-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-bold uppercase rounded-lg cursor-pointer">
                                            Sair do Painel
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Modal Confirmação Capitão */}
                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl max-w-sm w-full shadow-2xl relative text-center">
                                <div className="w-16 h-16 bg-yellow-500/15 rounded-full flex items-center justify-center border border-yellow-500/20 text-yellow-500 mx-auto mb-3">
                                    <Icon name="alert-triangle" size={32} />
                                </div>
                                <h2 className="text-lg font-bold text-zinc-100">Remover Capitão(ã)?</h2>
                                <p className="text-sm text-zinc-400 mt-2">Você deseja remover <strong className="text-yellow-400">{confirmDialog.mc?.name}</strong> do posto de capitão(ã) do Trio {Number(confirmDialog.trioId) + 1}?</p>
                                
                                <div className="flex gap-3 w-full mt-6">
                                    <button onClick={() => setConfirmDialog({ isOpen: false, mc: null, trioId: null })} className="flex-1 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-bold uppercase rounded-lg cursor-pointer">Cancelar</button>
                                    <button onClick={() => executeRemoval(confirmDialog.mc, confirmDialog.trioId)} className="flex-1 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-bold uppercase rounded-lg cursor-pointer">Sim, Remover</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Confirmação Trio */}
                    {confirmTrioRemoval.isOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl max-w-sm w-full shadow-2xl relative text-center">
                                <div className="w-16 h-16 bg-red-500/15 rounded-full flex items-center justify-center border border-red-500/20 text-red-500 mx-auto mb-3">
                                    <Icon name="alert-triangle" size={32} />
                                </div>
                                <h2 className="text-lg font-bold text-zinc-100">Remover Trio?</h2>
                                <p className="text-sm text-zinc-400 mt-2">Deseja remover o <strong className="text-red-400">Trio {Number(confirmTrioRemoval.trioId) + 1}</strong>? Os MCs voltarão para a lista geral.</p>
                                
                                <div className="flex gap-3 w-full mt-6">
                                    <button onClick={() => setConfirmTrioRemoval({ isOpen: false, trioId: null })} className="flex-1 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-bold uppercase rounded-lg cursor-pointer">Cancelar</button>
                                    <button onClick={() => executeTrioRemoval(confirmTrioRemoval.trioId)} className="flex-1 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-bold uppercase rounded-lg cursor-pointer">Sim, Remover</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
