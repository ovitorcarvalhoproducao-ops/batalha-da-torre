<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalha da Torre - Draft Oficial</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts: Unbounded (Apenas para Títulos/Sorteio) -->
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        .font-sf { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }
        .font-unbounded {
            font-family: 'Unbounded', sans-serif;
        }
        
        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation-duration: 0.3s;
            animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1);
        }

        body {
            background-color: #000000;
            color: #f5f5f7;
            position: relative;
            min-height: 100vh;
            transition: background-color 0.5s ease;
            background-image: 
                linear-gradient(rgba(220, 38, 38, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(220, 38, 38, 0.15) 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: center center;
        }

        body::before {
            content: "";
            position: fixed;
            top: -20%; left: -10%;
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.25) 0%, transparent 60%);
            filter: blur(100px);
            z-index: -1;
            pointer-events: none;
            transition: background 0.5s ease;
        }
        body::after {
            content: "";
            position: fixed;
            bottom: -20%; right: -10%;
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 60%);
            filter: blur(100px);
            z-index: -1;
            pointer-events: none;
            transition: background 0.5s ease;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        .trio-tilt-card {
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s ease;
            transform-style: preserve-3d;
            will-change: transform;
        }

        @keyframes modal-pop {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-modal-pop {
            animation: modal-pop 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .apple-btn {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
            color: #e4e4e7;
            transition: all 0.3s ease;
        }
        .apple-btn:hover { background-color: rgba(255, 255, 255, 0.15); }

        .apple-glass {
            background-color: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }
        .apple-glass-yellow {
            background-color: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 2px solid rgba(250, 204, 21, 0.4); 
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }
        .apple-glass-green {
            background-color: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 3px solid rgba(74, 222, 128, 1);
            box-shadow: 0 0 40px rgba(74, 222, 128, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .shuffle-title { color: #f5f5f7; }
        .shuffle-icon, .shuffle-countdown { color: #ef4444; }
        .shuffle-countdown { background-image: linear-gradient(to bottom, #f87171, #dc2626); -webkit-background-clip: text; color: transparent; }

        body.light-mode {
            background-color: #f5f5f7;
            color: #1d1d1f;
            background-image: 
                linear-gradient(rgba(220, 38, 38, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(220, 38, 38, 0.15) 1px, transparent 1px);
        }
        body.light-mode::before { background: radial-gradient(circle, rgba(0, 122, 255, 0.3) 0%, transparent 60%); }
        body.light-mode::after { background: radial-gradient(circle, rgba(255, 45, 85, 0.3) 0%, transparent 60%); }
        
        body.light-mode .text-zinc-100, body.light-mode .text-white { color: #1d1d1f !important; }
        body.light-mode .text-zinc-200 { color: #333336 !important; }
        body.light-mode .text-zinc-300 { color: #515154 !important; }
        body.light-mode .text-zinc-400 { color: #86868b !important; }
        body.light-mode .text-zinc-500 { color: #86868b !important; }
        
        body.light-mode .apple-btn {
            background-color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.8);
            color: #1d1d1f;
        }
        body.light-mode .apple-btn:hover { background-color: rgba(255, 255, 255, 0.95); }

        body.light-mode .apple-glass {
            background-color: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.8);
        }
        body.light-mode .apple-glass-yellow {
            background-color: rgba(255, 255, 255, 0.65);
            border: 2px solid rgba(234, 179, 8, 0.6);
            box-shadow: 0 16px 32px rgba(234, 179, 8, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.8);
        }
        body.light-mode .apple-glass-green {
            background-color: rgba(255, 255, 255, 0.65) !important;
            border: 3px solid rgba(34, 197, 94, 1) !important;
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.8) !important;
        }
        
        body.light-mode .bg-black\/40 { background-color: rgba(0, 0, 0, 0.03) !important; }
        body.light-mode .bg-black\/20 { background-color: rgba(0, 0, 0, 0.02) !important; }
        body.light-mode .bg-black\/10 { background-color: rgba(0, 0, 0, 0.03) !important; }
        body.light-mode .bg-black\/5 { background-color: rgba(0, 0, 0, 0.02) !important; }
        body.light-mode .bg-black\/50 { background-color: rgba(255, 255, 255, 0.7) !important; border-color: rgba(0,0,0,0.15) !important; color: #18181b !important; }
        body.light-mode .border-white\/10, body.light-mode .border-white\/5 { border-color: rgba(0,0,0,0.06) !important; }
        
        body.light-mode .from-yellow-400\/30 { background-image: linear-gradient(to right, rgba(202, 138, 4, 0.25), rgba(255, 255, 255, 0.5)) !important; }
        body.light-mode .text-yellow-300 { color: #b45309 !important; } 
        body.light-mode .text-yellow-400 { color: #d97706 !important; } 
        
        body.light-mode .empty-captain-text { color: #b45309 !important; }
        body.light-mode .empty-regular-text { color: rgba(0, 0, 0, 0.4) !important; }
        body.light-mode .empty-regular-box { border-color: rgba(0, 0, 0, 0.4) !important; background-color: rgba(0, 0, 0, 0.04) !important; }

        body.light-mode .badge-complete { background-color: rgba(34, 197, 94, 0.25) !important; color: #15803d !important; border: 1px solid rgba(34, 197, 94, 0.6) !important; font-weight: 700 !important; }

        body.light-mode .bg-red-600 { color: #ffffff !important; }
        body.light-mode .theme-selector-btn.active { background-color: #1d1d1f; color: #ffffff; }

        body.light-mode .shuffle-title { color: #ef4444 !important; }
        body.light-mode .shuffle-icon, body.light-mode .shuffle-countdown { color: #ef4444 !important; }
        body.light-mode .shuffle-countdown { background-image: linear-gradient(to bottom, #ef4444, #b91c1c); }

        body.light-mode .repetition-btn-off {
            background-color: rgba(0, 0, 0, 0.05) !important;
            border-color: rgba(0, 0, 0, 0.15) !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1) !important;
        }

        body.red-mode {
            background-color: #991b1b; 
            color: #f5f5f7;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.3) 1px, transparent 1px);
        }
        body.red-mode::before { background: radial-gradient(circle, rgba(0, 0, 0, 0.4) 0%, transparent 60%); }
        body.red-mode::after { background: radial-gradient(circle, rgba(0, 0, 0, 0.3) 0%, transparent 60%); }
        
        body.red-mode .text-zinc-400,
        body.red-mode .text-zinc-500,
        body.red-mode .text-zinc-300,
        body.red-mode .text-zinc-600 {
            color: #ffffff !important;
        }
        body.red-mode .border-white\/10 {
            border-color: rgba(255,255,255,0.3) !important;
        }

        body.red-mode .apple-btn {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
        body.red-mode .apple-btn:hover { background-color: rgba(0, 0, 0, 0.4); }

        body.red-mode .apple-glass {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }
        body.red-mode .apple-glass-yellow {
            background-color: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(234, 179, 8, 0.5);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }
        body.red-mode .apple-glass-green {
            background-color: rgba(0, 0, 0, 0.3) !important;
            border: 3px solid rgba(74, 222, 128, 1) !important;
            box-shadow: 0 0 50px rgba(74, 222, 128, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15) !important;
        }
        
        body.red-mode .badge-complete { background-color: rgba(74, 222, 128, 0.25) !important; color: #4ade80 !important; border: 1px solid rgba(74, 222, 128, 0.6) !important; font-weight: 700 !important; }

        body.red-mode .bg-red-600 { background-color: #000000 !important; color: #ffffff !important; box-shadow: 0 8px 24px rgba(0,0,0,0.5) !important; }
        body.red-mode .text-red-500, body.red-mode .text-red-400, body.red-mode .text-red-600 { color: #000000 !important; }
        body.red-mode .border-red-500\/50, body.red-mode .border-red-500\/40, body.red-mode .border-red-500\/20, body.red-mode .border-red-500\/30 { border-color: rgba(0,0,0,0.3) !important; }
        body.red-mode .bg-red-500\/10, body.red-mode .bg-red-500\/5 { background-color: rgba(0,0,0,0.2) !important; }
        body.red-mode .shadow-red-600\/20 { box-shadow: 0 8px 20px rgba(0,0,0,0.4) !important; }
        
        /* Regra Exclusiva para não escurecer avisos críticos no modo vermelho */
        body.red-mode .text-always-red { color: #ef4444 !important; }
        body.red-mode .red-mode-white { color: #ffffff !important; }
        
        body.red-mode .shuffle-title { color: #ffffff !important; }
        body.red-mode .shuffle-icon { color: #ffffff !important; }
        body.red-mode .shuffle-countdown { background-image: none !important; background-color: transparent !important; color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; }

        body.red-mode .settings-concluir-btn,
        body.red-mode .modal-red-btn {
            background-color: #ef4444 !important;
            color: #ffffff !important;
            box-shadow: 0 8px 24px rgba(220, 38, 38, 0.5) !important;
        }
        body.red-mode .settings-badge {
            background-color: #b91c1c !important;
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
        }
        body.red-mode .add-mc-btn {
            background-color: #ffffff !important;
            color: #991b1b !important;
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.3) !important;
        }
        body.red-mode .mc-list-header-icon {
            color: #ffffff !important;
        }
    </style>
</head>
<body class="font-sf selection:bg-red-500/30 overflow-x-hidden transition-colors duration-500">
    <div id="root"></div>

    <script type="text/babel">
        // Função auxiliar para recalcular chaves removidas sequencialmente
        const compactTriosMap = (triosObj) => {
            const remainingKeys = Object.keys(triosObj).map(Number).sort((a,b)=>a-b);
            const compacted = {};
            remainingKeys.forEach((oldKey, newIdx) => {
                compacted[newIdx] = triosObj[oldKey];
            });
            return compacted;
        };

        const { useState, useMemo, useEffect } = React;
        
        const Icon = ({ name, size = 16, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <span className="inline-flex items-center justify-center"><i data-lucide={name} className={className} style={{ width: size, height: size, display: 'inline-block' }}></i></span>;
        };

        function App() {
            const urlParams = new URLSearchParams(window.location.search);
            const initialMode = ['chaveamento', 'folhinha'].includes(urlParams.get('mode')) ? urlParams.get('mode') : 'draft';

            const [theme, setTheme] = useState('dark');
            const [appMode, setAppMode] = useState(initialMode);
            const [isModeInfoOpen, setIsModeInfoOpen] = useState(false);

            const [newMcName, setNewMcName] = useState('');
            const [warning, setWarning] = useState('');
            const [availableMCs, setAvailableMCs] = useState([]);
            
            // Inicialização dinâmica de caixas baseada no modo atual
            const initialTrios = {};
            const initialBoxCount = (initialMode === 'chaveamento' || initialMode === 'folhinha') ? 16 : 8;
            for (let i = 0; i < initialBoxCount; i++) {
                initialTrios[i] = [];
            }
            const [trios, setTrios] = useState(initialTrios);
            
            const [draggingOverId, setDraggingOverId] = useState(null);
            const [draggedMcId, setDraggedMcId] = useState(null);
            const [draggedSourceId, setDraggedSourceId] = useState(null);

            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, mc: null, trioId: null });
            const [confirmTrioRemoval, setConfirmTrioRemoval] = useState({ isOpen: false, trioId: null });
            const [confirmGoToChaveamento, setConfirmGoToChaveamento] = useState(false);
            const [confirmRestartDraw, setConfirmRestartDraw] = useState(false);

            const [isShuffling, setIsShuffling] = useState(false);
            const [countdown, setCountdown] = useState((initialMode === 'chaveamento' || initialMode === 'folhinha') ? 3 : 5);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [configCountdown, setConfigCountdown] = useState((initialMode === 'chaveamento' || initialMode === 'folhinha') ? 3 : 5);
            const [configShuffleSteps, setConfigShuffleSteps] = useState(5);
            const [configGroupSize, setConfigGroupSize] = useState((initialMode === 'chaveamento' || initialMode === 'folhinha') ? 1 : 3); 

            const [allowRepetition, setAllowRepetition] = useState(false);
            const [drawnGroups, setDrawnGroups] = useState([]);
            const [drawnResultModal, setDrawnResultModal] = useState({ isOpen: false, result: null, groupIndex: null });
            const [confirmModeSwitch, setConfirmModeSwitch] = useState({ isOpen: false, targetMode: null });

            // Estados da Folhinha
            const [bracketSize, setBracketSize] = useState(16);
            const [bracketParticipants, setBracketParticipants] = useState([]);
            const [bracketAdvancements, setBracketAdvancements] = useState({});
            const [confirmClearBracket, setConfirmClearBracket] = useState(false);
            const [lastEliminatedMcs, setLastEliminatedMcs] = useState([]);

            const [isHelpOpen, setIsHelpOpen] = useState(false);

            const [titleText, setTitleText] = useState('Batalha da Torre');
            const [titleColor, setTitleColor] = useState('#dc2626'); 
            const [logoImg, setLogoImg] = useState(null);
            const [logoZoom, setLogoZoom] = useState(1);

            useEffect(() => {
                document.body.classList.remove('light-mode', 'red-mode');
                if (theme === 'light') {
                    document.body.classList.add('light-mode');
                } else if (theme === 'red') {
                    document.body.classList.add('red-mode');
                }
            }, [theme]);

            const sortedAvailableMCs = useMemo(() => {
                return [...availableMCs].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
            }, [availableMCs]);

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setLogoImg(reader.result);
                        setLogoZoom(1);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleAddMc = (e) => {
                e.preventDefault();
                if (!newMcName.trim()) return;
                
                // Quebra a string por vírgulas ou quebras de linha
                const rawNames = newMcName.split(/,|\n/);
                
                const processedNames = rawNames.map(name => {
                    return name.replace(/^[\s\d\.\-\*•]+/, '').trim();
                }).filter(name => name.length > 0);

                if (processedNames.length > 0) {
                    const newMcs = processedNames.map(name => ({
                        id: Date.now().toString() + Math.random(),
                        name: name
                    }));
                    setAvailableMCs([...availableMCs, ...newMcs]);
                    setNewMcName('');
                    setWarning('');
                }
            };

            const handleCopyMCs = async () => {
                if (availableMCs.length === 0) return;
                const text = `${availableMCs.length} Mc's na lista:\n` + sortedAvailableMCs.map((mc, idx) => `${idx + 1}. ${mc.name}`).join('\n');
                
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setWarning('📋 Lista numerada copiada com sucesso!');
                    setTimeout(() => setWarning(''), 3000);
                } catch (err) {
                    console.error('Erro ao copiar', err);
                }
                document.body.removeChild(textArea);

                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'Lista de MCs',
                            text: text
                        });
                    } catch (err) {
                        // Tratar cancelamento nativo silenciosamente
                    }
                }
            };

            const handleCopyDrawnAndNotDrawn = async () => {
                const drawnIds = new Set(bracketParticipants.flat().map(mc => mc.id));
                const drawnNames = bracketParticipants.map((group, idx) => `${idx + 1}. ${group.map(m => m.name).join(' / ')}`);

                const currentNotDrawnGroups = Object.values(trios).filter(group => group.length > 0 && !group.some(mc => drawnIds.has(mc.id)));
                const allNotDrawnGroups = currentNotDrawnGroups.length > 0 ? currentNotDrawnGroups : lastEliminatedMcs;
                const notDrawnNames = allNotDrawnGroups.map((group, idx) => `${idx + 1}. ${group.map(m => m.name).join(' / ')}`);

                let text = `Mc's Sorteados (${drawnNames.length}):\n`;
                text += drawnNames.length > 0 ? drawnNames.join('\n') : 'Nenhum';
                text += `\n\nMc's não sorteados (${notDrawnNames.length}):\n`;
                text += notDrawnNames.length > 0 ? notDrawnNames.join('\n') : 'Nenhum';

                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setWarning('📋 Lista de Sorteados e Não Sorteados copiada!');
                    setTimeout(() => setWarning(''), 3000);
                } catch (err) {
                    console.error('Erro ao copiar', err);
                }
                document.body.removeChild(textArea);

                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'Resultado do Sorteio',
                            text: text
                        });
                    } catch (err) {}
                }
            };

            const handleExportBracket = async () => {
                const numRounds = Math.log2(bracketSize) + 1;
                let text = `🏆 CHAVE DO TORNEIO - ${titleText.toUpperCase()} 🏆\n\n`;

                const getRoundName = (r, totalR) => {
                    const matchesCount = bracketSize / Math.pow(2, r + 1);
                    if (matchesCount === 16) return "16 AVOS DE FINAL";
                    if (matchesCount === 8) return "OITAVAS DE FINAL";
                    if (matchesCount === 4) return "QUARTAS DE FINAL";
                    if (matchesCount === 2) return "SEMIFINAL";
                    if (matchesCount === 1) return "FINAL";
                    return `FASE ${r + 1}`;
                };

                for (let r = 0; r < numRounds - 1; r++) {
                    const numMatches = bracketSize / Math.pow(2, r + 1);
                    let roundHasData = false;
                    let roundText = `--- ${getRoundName(r, numRounds)} ---\n`;

                    for (let m = 0; m < numMatches; m++) {
                        let p1Data = r === 0 ? (bracketParticipants[m * 2] || null) : (bracketAdvancements[`${r-1}_${m * 2}`] || null);
                        let p2Data = r === 0 ? (bracketParticipants[m * 2 + 1] || null) : (bracketAdvancements[`${r-1}_${m * 2 + 1}`] || null);

                        if (p1Data || p2Data) roundHasData = true;

                        const p1Name = p1Data ? p1Data.map(mc => mc.name).join(' / ') : 'Aguardando';
                        const p2Name = p2Data ? p2Data.map(mc => mc.name).join(' / ') : 'Aguardando';

                        roundText += `Confronto ${m + 1}: ${p1Name} vs ${p2Name}\n`;
                    }

                    if (roundHasData || r === 0) {
                        text += roundText + '\n';
                    }
                }

                const champData = bracketAdvancements[`${numRounds - 2}_0`];
                if (champData) {
                    text += `👑 CAMPEÃO: ${champData.map(mc => mc.name).join(' / ')}\n`;
                }

                const textArea = document.createElement("textarea");
                textArea.value = text.trim();
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setWarning('📋 Chave do torneio copiada com sucesso!');
                    setTimeout(() => setWarning(''), 3000);
                } catch (err) {
                    console.error('Erro ao copiar chave', err);
                }
                document.body.removeChild(textArea);

                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: `Chave - ${titleText}`,
                            text: text.trim()
                        });
                    } catch (err) {}
                }
            };

            const handleAutoAssign = (mc) => {
                if (appMode !== 'chaveamento') return;

                const existingKeys = Object.keys(trios).map(Number).sort((a,b)=>a-b);
                let targetBox = -1;
                
                for (let key of existingKeys) {
                    if (trios[key].length < configGroupSize) {
                        targetBox = key;
                        break;
                    }
                }
                
                let newTrios = { ...trios };
                if (targetBox === -1) {
                    targetBox = existingKeys.length > 0 ? Math.max(...existingKeys) + 1 : 0;
                    newTrios[targetBox] = [];
                }
                
                setAvailableMCs(prev => prev.filter(m => m.id !== mc.id));
                newTrios[targetBox] = [...newTrios[targetBox], mc];
                setTrios(newTrios);
            };

            const handleModeSwitchRequest = (targetMode) => {
                if (appMode === targetMode) return;
                
                // Permite transição livre entre chaveamento e folhinha sem pedir reset de dados
                if ((appMode === 'chaveamento' && targetMode === 'folhinha') || (appMode === 'folhinha' && targetMode === 'chaveamento')) {
                    setAppMode(targetMode);
                    setIsModeInfoOpen(false);
                    try { window.history.pushState(null, '', `?mode=${targetMode}`); } catch (e) {}
                    return;
                }

                const hasProgress = availableMCs.length > 0 || Object.values(trios).some(t => t.length > 0);
                if (hasProgress) {
                    setConfirmModeSwitch({ isOpen: true, targetMode });
                } else {
                    executeModeSwitch(targetMode);
                }
            };

            const executeModeSwitch = (targetMode) => {
                setAppMode(targetMode);
                setAvailableMCs([]);
                
                let newTrios = {};
                let boxCount = (targetMode === 'chaveamento' || targetMode === 'folhinha') ? 16 : 8;
                for (let i = 0; i < boxCount; i++) {
                    newTrios[i] = [];
                }
                setTrios(newTrios);
                
                setDrawnGroups([]);
                setBracketParticipants([]);
                setBracketAdvancements({});
                setConfigGroupSize((targetMode === 'chaveamento' || targetMode === 'folhinha') ? 1 : 3);
                setConfigCountdown((targetMode === 'chaveamento' || targetMode === 'folhinha') ? 3 : 5);
                setConfirmModeSwitch({ isOpen: false, targetMode: null });
                setWarning('');
                
                try {
                    window.history.pushState(null, '', `?mode=${targetMode}`);
                } catch (e) {
                    console.warn("URL update blocked by iframe environment.");
                }
            };

            const handleGoToChaveamentoConfirm = () => {
                setConfirmGoToChaveamento(false);
                setAppMode('chaveamento');
                setAvailableMCs([]);
                setDrawnGroups([]);
                try {
                    window.history.pushState(null, '', `?mode=chaveamento`);
                } catch (e) {}
            };

            const handleDragStart = (e, mc, sourceId) => {
                setDraggedMcId(mc.id);
                setDraggedSourceId(sourceId);
                e.dataTransfer.setData('text/plain', mc.id);
                e.dataTransfer.effectAllowed = 'move';
            };

            const handleDragOver = (e, targetId) => {
                e.preventDefault();
                if (draggingOverId !== targetId) {
                    setDraggingOverId(targetId);
                }
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                setDraggingOverId(null);
            };

            const handleDrop = (e, targetId) => {
                e.preventDefault();
                setDraggingOverId(null);
                setWarning('');

                const mcId = draggedMcId;
                const sourceId = draggedSourceId;

                if (!mcId || sourceId === targetId.toString()) return;

                let mcToMove = null;
                if (sourceId === 'available') {
                    mcToMove = availableMCs.find(mc => mc.id === mcId);
                } else {
                    mcToMove = trios[sourceId]?.find(mc => mc.id === mcId);
                }

                if (!mcToMove) return;

                if (targetId !== 'available' && trios[targetId].length >= configGroupSize) {
                    const groupName = configGroupSize === 2 ? 'A Dupla' : `O ${configGroupSize === 3 ? 'Trio' : configGroupSize === 4 ? 'Quarteto' : 'Quinteto'}`;
                    setWarning(`${groupName} ${Number(targetId) + 1} já está complet${configGroupSize === 2 ? 'a' : 'o'}!`);
                    return;
                }

                if (sourceId === 'available') {
                    setAvailableMCs(prev => prev.filter(mc => mc.id !== mcId));
                } else {
                    setTrios(prev => {
                        const updated = { ...prev };
                        updated[sourceId] = updated[sourceId].filter(mc => mc.id !== mcId);
                        if (updated[sourceId].length === 0) delete updated[sourceId];
                        
                        if (targetId !== 'available') {
                            if (!updated[targetId]) updated[targetId] = [];
                            updated[targetId] = [...updated[targetId], mcToMove];
                        }
                        return compactTriosMap(updated);
                    });
                }

                if (targetId === 'available') {
                    setAvailableMCs(prev => [...prev, mcToMove]);
                } else {
                    if (sourceId === 'available') {
                        setTrios(prev => {
                            const updated = { ...prev };
                            if (!updated[targetId]) updated[targetId] = [];
                            updated[targetId] = [...updated[targetId], mcToMove];
                            return compactTriosMap(updated);
                        });
                    }
                }

                setDraggedMcId(null);
                setDraggedSourceId(null);
            };

            const requestRemoval = (mc, trioId, indexInTrio) => {
                setWarning('');
                if (indexInTrio === 0 && appMode === 'draft' && configGroupSize > 1) {
                    setConfirmDialog({ isOpen: true, mc, trioId });
                } else {
                    executeRemoval(mc, trioId);
                }
            };

            const executeRemoval = (mc, sourceTrioId) => {
                setTrios(prev => {
                    const updatedGroup = prev[sourceTrioId].filter(item => item.id !== mc.id);
                    const newTrios = { ...prev };
                    if (updatedGroup.length === 0) {
                        delete newTrios[sourceTrioId];
                    } else {
                        newTrios[sourceTrioId] = updatedGroup;
                    }
                    return compactTriosMap(newTrios);
                });
                setAvailableMCs(prev => [...prev, mc]);
                setConfirmDialog({ isOpen: false, mc: null, trioId: null });
            };

            const executeTrioRemoval = (trioId) => {
                const mcsToReturn = trios[trioId] || [];
                if (mcsToReturn.length > 0) {
                    setAvailableMCs(prev => [...prev, ...mcsToReturn]);
                }
                setTrios(prev => {
                    const newTrios = { ...prev };
                    delete newTrios[trioId];
                    return compactTriosMap(newTrios);
                });
                setConfirmTrioRemoval({ isOpen: false, trioId: null });
            };

            const handleAddTrio = () => {
                const existingKeys = Object.keys(trios).map(Number);
                const nextIndex = existingKeys.length > 0 ? Math.max(...existingKeys) + 1 : 0;
                setTrios(prev => ({ ...prev, [nextIndex]: [] }));
            };

            const handleCardMouseMove = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                const rotateX = -((y - centerY) / centerY) * 5; 
                const rotateY = ((x - centerX) / centerX) * 5;

                e.currentTarget.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
            };

            const handleCardMouseLeave = (e) => {
                e.currentTarget.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
            };

            const startShuffle = () => {
                if (appMode === 'folhinha') {
                    const numRounds = Math.log2(bracketSize) + 1;
                    let targetRound = -1;
                    for (let r = numRounds - 2; r >= 0; r--) {
                        if (r === 0) {
                            if (bracketParticipants.filter(Boolean).length >= 2) {
                                targetRound = 0;
                                break;
                            }
                        } else {
                            const numSlots = bracketSize / Math.pow(2, r);
                            let count = 0;
                            for (let s = 0; s < numSlots; s++) {
                                if (bracketAdvancements[`${r-1}_${s}`]) count++;
                            }
                            if (count >= 2) {
                                targetRound = r;
                                break;
                            }
                        }
                    }

                    if (targetRound === -1) {
                        setWarning("Adicione ou avance pelo menos 2 participantes na chave para sortear os confrontos!");
                        setTimeout(() => setWarning(''), 3500);
                        return;
                    }

                    executeFolhinhaShuffle();
                    return;
                }

                if (appMode === 'chaveamento') {
                    const validGroups = Object.entries(trios).filter(([_, mcs]) => mcs.length > 0);
                    let availableToDraw = validGroups;
                    
                    if (!allowRepetition) {
                        availableToDraw = validGroups.filter(([index]) => !drawnGroups.includes(index));
                    }

                    if (availableToDraw.length === 0) {
                        if (validGroups.length === 0) {
                            setWarning("Nenhum participante adicionado nas chaves!");
                            setTimeout(() => setWarning(''), 4000);
                        } else {
                            // Quando tenta sortear mas já sorteou todo mundo, ativa o Modal de Reiniciar
                            setConfirmRestartDraw(true);
                        }
                        return;
                    }
                }

                setIsShuffling(true);
                setCountdown(configCountdown);

                let currentCount = configCountdown;
                const timer = setInterval(() => {
                    currentCount -= 1;
                    if (currentCount > 0) {
                        setCountdown(currentCount);
                    } else {
                        clearInterval(timer);
                        setCountdown(0);
                        setTimeout(() => {
                            if (appMode === 'draft') {
                                executeShuffle();
                            } else if (appMode === 'folhinha') {
                                executeFolhinhaShuffle();
                            } else {
                                executeChaveamentoDraw();
                            }
                        }, 400);
                    }
                }, 1000);
            };

            const executeFolhinhaShuffle = async () => {
                setIsShuffling(false);
                await new Promise(resolve => setTimeout(resolve, 50));

                const numRounds = Math.log2(bracketSize) + 1;
                let targetRound = -1;
                for (let r = numRounds - 2; r >= 0; r--) {
                    if (r === 0) {
                        if (bracketParticipants.filter(Boolean).length >= 2) {
                            targetRound = 0;
                            break;
                        }
                    } else {
                        const numSlots = bracketSize / Math.pow(2, r);
                        let count = 0;
                        for (let s = 0; s < numSlots; s++) {
                            if (bracketAdvancements[`${r-1}_${s}`]) count++;
                        }
                        if (count >= 2) {
                            targetRound = r;
                            break;
                        }
                    }
                }

                if (targetRound === -1) return;

                const numSlots = bracketSize / Math.pow(2, targetRound);
                let currentSlots = [];
                if (targetRound === 0) {
                    for (let s = 0; s < numSlots; s++) {
                        currentSlots.push(bracketParticipants[s] || null);
                    }
                } else {
                    for (let s = 0; s < numSlots; s++) {
                        currentSlots.push(bracketAdvancements[`${targetRound - 1}_${s}`] || null);
                    }
                }

                const populatedIndices = [];
                const populatedValues = [];
                currentSlots.forEach((val, idx) => {
                    if (val !== null) {
                        populatedIndices.push(idx);
                        populatedValues.push(val);
                    }
                });

                if (populatedValues.length <= 1) return;

                let currentValues = [...populatedValues];
                const originalValues = [...populatedValues];

                const getDerangement = (currentArray, originalArrayToAvoid) => {
                    if (currentArray.length <= 1) return [...currentArray];
                    let newArray = [...currentArray];
                    let isDerangement = false;
                    let attempts = 0;
                    while (!isDerangement && attempts < 200) {
                        for (let i = newArray.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                        }
                        isDerangement = true;
                        for (let i = 0; i < currentArray.length; i++) {
                            if (newArray[i] === currentArray[i]) {
                                isDerangement = false;
                                break;
                            }
                            if (originalArrayToAvoid && newArray[i] === originalArrayToAvoid[i]) {
                                isDerangement = false;
                                break;
                            }
                        }
                        attempts++;
                    }
                    return newArray;
                };

                const steps = 5;
                for (let step = 1; step <= steps; step++) {
                    await new Promise(resolve => {
                        const isLastStep = step === steps;
                        const nextValues = getDerangement(currentValues, isLastStep ? originalValues : null);
                        currentValues = nextValues;

                        const applyFolhinhaShuffle = () => {
                            if (targetRound === 0) {
                                setBracketParticipants(prev => {
                                    const updated = [...prev];
                                    populatedIndices.forEach((slotIdx, i) => {
                                        updated[slotIdx] = nextValues[i];
                                    });
                                    return updated;
                                });
                                setBracketAdvancements({});
                            } else {
                                setBracketAdvancements(prev => {
                                    const updated = { ...prev };
                                    populatedIndices.forEach((slotIdx, i) => {
                                        updated[`${targetRound - 1}_${slotIdx}`] = nextValues[i];
                                    });
                                    Object.keys(updated).forEach(k => {
                                        const [rIdx] = k.split('_').map(Number);
                                        if (rIdx >= targetRound) {
                                            delete updated[k];
                                        }
                                    });
                                    return updated;
                                });
                            }
                        };

                        if (document.startViewTransition) {
                            const transition = document.startViewTransition(() => {
                                ReactDOM.flushSync(() => {
                                    applyFolhinhaShuffle();
                                });
                            });
                            transition.finished.then(() => {
                                setTimeout(resolve, isLastStep ? 0 : 400);
                            });
                        } else {
                            applyFolhinhaShuffle();
                            setTimeout(resolve, 300);
                        }
                    });
                }
            };

            const executeChaveamentoDraw = () => {
                setIsShuffling(false);
                
                const validGroups = Object.entries(trios).filter(([_, mcs]) => mcs.length > 0);
                let availableToDraw = validGroups;
                if (!allowRepetition) {
                    availableToDraw = validGroups.filter(([index]) => !drawnGroups.includes(index));
                }

                if (availableToDraw.length > 0) {
                    const randomIndex = Math.floor(Math.random() * availableToDraw.length);
                    const [chosenIndex, chosenMcs] = availableToDraw[randomIndex];
                    
                    setDrawnGroups(prev => [...prev, chosenIndex]);
                    setDrawnResultModal({ isOpen: true, result: chosenMcs, groupIndex: chosenIndex });
                    
                    // Joga pro modo folhinha automaticamente
                    setBracketParticipants(prev => {
                        if (prev.length < bracketSize) {
                            const newParticipants = [...prev, chosenMcs];
                            
                            // Quando atinge o limite do tamanho da chave, remove os que não foram sorteados das boxes do modo chaveamento
                            if (newParticipants.length === bracketSize) {
                                const drawnMcIds = new Set(newParticipants.flat().map(mc => mc.id));
                                
                                setTimeout(() => {
                                    setTrios(currentTrios => {
                                        const newTrios = {};
                                        const eliminated = [];
                                        let newIdx = 0;
                                        Object.keys(currentTrios).map(Number).sort((a,b)=>a-b).forEach(key => {
                                            const group = currentTrios[key];
                                            const isGroupDrawn = group.length > 0 && group.some(mc => drawnMcIds.has(mc.id));
                                            if (isGroupDrawn) {
                                                newTrios[newIdx] = group;
                                                newIdx++;
                                            } else if (group.length > 0) {
                                                eliminated.push(group);
                                            }
                                        });
                                        setLastEliminatedMcs(eliminated);
                                        // Garante que todos os grupos que ficaram apareçam como já sorteados após a reindexação
                                        setDrawnGroups(Object.keys(newTrios));
                                        return newTrios;
                                    });
                                }, 0);
                            }
                            
                            return newParticipants;
                        } else {
                            setWarning(`A Chave do Torneio (Folhinha) já está cheia (${bracketSize} vagas).`);
                            return prev;
                        }
                    });
                }
            };

            const executeShuffle = async () => {
                setIsShuffling(false);

                await new Promise(resolve => setTimeout(resolve, 50));

                let currentTrioValues = Object.values(trios);
                const originalTrioValues = [...currentTrioValues];

                const getDerangement = (currentArray, originalArrayToAvoid) => {
                    if (currentArray.length <= 1) return [...currentArray];
                    let newArray = [...currentArray];
                    let isDerangement = false;
                    let attempts = 0;
                    
                    while (!isDerangement && attempts < 200) {
                        for (let i = newArray.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                        }
                        
                        isDerangement = true;
                        for (let i = 0; i < currentArray.length; i++) {
                            if (newArray[i] === currentArray[i]) {
                                isDerangement = false;
                                break;
                            }
                            if (originalArrayToAvoid && newArray[i] === originalArrayToAvoid[i]) {
                                isDerangement = false;
                                break;
                            }
                        }
                        attempts++;
                    }
                    return newArray;
                };

                for (let step = 1; step <= configShuffleSteps; step++) {
                    await new Promise(resolve => {
                        const isLastStep = step === configShuffleSteps;
                        const nextTrioValues = getDerangement(
                            currentTrioValues, 
                            isLastStep ? originalTrioValues : null
                        );
                        currentTrioValues = nextTrioValues;

                        const applyShuffle = () => {
                            setTrios(() => {
                                const newTrios = {};
                                nextTrioValues.forEach((trio, index) => {
                                    newTrios[index] = trio; 
                                });
                                return newTrios;
                            });
                        };

                        if (document.startViewTransition) {
                            const transition = document.startViewTransition(() => {
                                ReactDOM.flushSync(() => {
                                    applyShuffle();
                                });
                            });
                            transition.finished.then(() => {
                                setTimeout(resolve, isLastStep ? 0 : 400); 
                            });
                        } else {
                            applyShuffle();
                            setTimeout(resolve, 300);
                        }
                    });
                }
            };

            useEffect(() => {
                const handleBeforeUnload = (e) => {
                    e.preventDefault();
                    e.returnValue = ''; 
                };
                window.addEventListener('beforeunload', handleBeforeUnload);
                return () => {
                    window.removeEventListener('beforeunload', handleBeforeUnload);
                };
            }, []);

            const getGroupName = () => {
                if (configGroupSize === 1) return 'MC';
                if (configGroupSize === 2) return 'Dupla';
                if (configGroupSize === 3) return 'Trio';
                if (configGroupSize === 4) return 'Quarteto';
                if (configGroupSize === 5) return 'Quinteto';
                return 'Grupo';
            };

            const hasAnyGroupContent = Object.values(trios).some(group => group.length > 0);

            // Criação visual e funcional da Folhinha (Bracket)
            const renderBracket = () => {
                const numRounds = Math.log2(bracketSize) + 1;
                const rounds = [];

                const isSameParticipant = (a, b) => {
                    if (!a || !b || a.length !== b.length) return false;
                    return a[0]?.id === b[0]?.id;
                };

                const advanceParticipant = (roundIndex, matchIndex, participantData, loserData) => {
                    if (!participantData) return;

                    let targetSlot = matchIndex;
                    const nextRoundTotalSlots = bracketSize / Math.pow(2, roundIndex + 1);

                    // Verifica se já está avançado na próxima fase
                    let alreadyAdvancedKey = null;
                    for (let s = 0; s < nextRoundTotalSlots; s++) {
                        if (isSameParticipant(bracketAdvancements[`${roundIndex}_${s}`], participantData)) {
                            alreadyAdvancedKey = `${roundIndex}_${s}`;
                            break;
                        }
                    }

                    if (alreadyAdvancedKey) return;

                    // Se o oponente deste mesmo confronto estava avançado, substitui na mesma vaga; senão ocupa o próximo espaço sequencial disponível
                    let loserSlot = -1;
                    if (loserData) {
                        for (let s = 0; s < nextRoundTotalSlots; s++) {
                            if (isSameParticipant(bracketAdvancements[`${roundIndex}_${s}`], loserData)) {
                                loserSlot = s;
                                break;
                            }
                        }
                    }

                    if (loserSlot !== -1) {
                        targetSlot = loserSlot;
                    } else if (bracketAdvancements[`${roundIndex}_${targetSlot}`]) {
                        for (let s = 0; s < nextRoundTotalSlots; s++) {
                            if (!bracketAdvancements[`${roundIndex}_${s}`]) {
                                targetSlot = s;
                                break;
                            }
                        }
                    }

                    setBracketAdvancements(prev => ({
                        ...prev,
                        [`${roundIndex}_${targetSlot}`]: participantData
                    }));

                    // Remove o MC/grupo perdedor do modo chaveamento
                    if (loserData && loserData.length > 0) {
                        const loserIds = new Set(loserData.map(mc => mc.id));
                        setTrios(currentTrios => {
                            const newTrios = {};
                            let newIdx = 0;
                            Object.keys(currentTrios).map(Number).sort((a,b)=>a-b).forEach(key => {
                                const group = currentTrios[key];
                                const remainingMcs = group.filter(mc => !loserIds.has(mc.id));
                                if (remainingMcs.length > 0) {
                                    newTrios[newIdx] = remainingMcs;
                                    newIdx++;
                                }
                            });
                            return newTrios;
                        });
                    }
                };

                const revertParticipantFromSlot = (roundIndex, slotIndex) => {
                    if (roundIndex === 0) return false;
                    const key = `${roundIndex - 1}_${slotIndex}`;
                    const participant = bracketAdvancements[key];
                    if (!participant) return false;

                    // Verifica se este participante já avançou para fases posteriores; se não avançou, clicar nele remove e volta pra fase anterior
                    const nextRoundSlots = bracketSize / Math.pow(2, roundIndex + 1);
                    let advancedFurther = false;
                    for (let s = 0; s < nextRoundSlots; s++) {
                        if (isSameParticipant(bracketAdvancements[`${roundIndex}_${s}`], participant)) {
                            advancedFurther = true;
                            break;
                        }
                    }

                    if (!advancedFurther) {
                        setBracketAdvancements(prev => {
                            const updated = { ...prev };
                            delete updated[key];
                            return updated;
                        });
                        return true;
                    }
                    return false;
                };

                for (let r = 0; r < numRounds; r++) {
                    const isChampionRound = r === numRounds - 1;
                    const numMatches = isChampionRound ? 1 : bracketSize / Math.pow(2, r + 1);
                    const matches = [];

                    for (let m = 0; m < numMatches; m++) {
                        if (isChampionRound) {
                            const champData = bracketAdvancements[`${r-1}_0`];
                            matches.push(
                                <div key={`champ-${m}`} className="flex flex-col justify-center my-2 relative z-10">
                                    <div className="text-[10px] text-yellow-400 font-bold uppercase mb-1 text-center flex items-center justify-center gap-1"><Icon name="crown" size={12}/> Campeão</div>
                                    <div 
                                        onClick={() => {
                                            if (champData) {
                                                setBracketAdvancements(prev => {
                                                    const updated = { ...prev };
                                                    delete updated[`${r-1}_0`];
                                                    return updated;
                                                });
                                            }
                                        }}
                                        title={champData ? "Clique para remover e voltar para a fase anterior" : ""}
                                        className={`h-[50px] w-36 md:w-48 rounded-xl border-2 flex items-center justify-center px-3 shadow-lg transition-all ${champData ? 'bg-yellow-500/20 border-yellow-500/50 text-yellow-400 cursor-pointer hover:scale-[1.02]' : 'bg-black/20 border-white/10 text-zinc-500 border-dashed'}`}
                                    >
                                        {champData ? <span className="font-bold truncate text-sm">{champData.map(mc=>mc.name).join(' / ')}</span> : <span className="text-[10px] uppercase font-semibold">Vazio</span>}
                                    </div>
                                </div>
                            );
                        } else {
                            let p1Data = r === 0 ? (bracketParticipants[m * 2] || null) : (bracketAdvancements[`${r-1}_${m * 2}`] || null);
                            let p2Data = r === 0 ? (bracketParticipants[m * 2 + 1] || null) : (bracketAdvancements[`${r-1}_${m * 2 + 1}`] || null);

                            const nextRoundTotalSlots = bracketSize / Math.pow(2, r + 1);
                            let p1Won = false;
                            let p2Won = false;
                            for (let s = 0; s < nextRoundTotalSlots; s++) {
                                const adv = bracketAdvancements[`${r}_${s}`];
                                if (adv) {
                                    if (isSameParticipant(adv, p1Data)) p1Won = true;
                                    if (isSameParticipant(adv, p2Data)) p2Won = true;
                                }
                            }
                            const p1Lost = p2Won && p1Data !== null;
                            const p2Lost = p1Won && p2Data !== null;

                            const p1VtName = p1Data && p1Data[0] ? `folha-r${r}-${p1Data[0].id.toString().replace(/[^a-zA-Z0-9]/g, '')}` : undefined;
                            const p2VtName = p2Data && p2Data[0] ? `folha-r${r}-${p2Data[0].id.toString().replace(/[^a-zA-Z0-9]/g, '')}` : undefined;

                                else if (p1Lost) p1Style = 'bg-red-500/20 border-red-500 text-red-400 red-mode-white hover:bg-red-500/30 hover:scale-[1.02]';
                                else p1Style = 'bg-black/40 border-white/20 hover:border-red-500/50 text-zinc-100 hover:bg-white/10 hover:scale-[1.02]';
                            }

                            let p2Style = 'bg-black/10 border-white/5 border-dashed text-zinc-600';
                            if (p2Data) {
                                if (p2Won) p2Style = 'bg-green-500/20 border-green-500 text-green-400 hover:bg-green-500/30 hover:scale-[1.02]';
                                else if (p2Lost) p2Style = 'bg-red-500/20 border-red-500 text-red-400 red-mode-white hover:bg-red-500/30 hover:scale-[1.02]';
                                else p2Style = 'bg-black/40 border-white/20 hover:border-red-500/50 text-zinc-100 hover:bg-white/10 hover:scale-[1.02]';
                            }

                            matches.push(
                                <div key={`match-${r}-${m}`} className="flex flex-col justify-center my-3 relative z-10">
                                    <div className="flex flex-col gap-2 p-2 bg-black/20 border border-white/5 rounded-2xl relative shadow-md">
                                        <div 
                                            onClick={() => {
                                                if (!p1Data) return;
                                                if (r > 0 && !p1Won && !p1Lost && !p2Data) {
                                                    revertParticipantFromSlot(r, m * 2);
                                                    return;
                                                }
                                                if (p1Won) return;
                                                advanceParticipant(r, m, p1Data, p2Data);
                                            }}
                                            onContextMenu={(e) => {
                                                if (r > 0 && p1Data) {
                                                    e.preventDefault();
                                                    revertParticipantFromSlot(r, m * 2);
                                                }
                                            }}
                                            style={p1VtName ? { viewTransitionName: p1VtName } : {}}
                                            className={`h-[44px] w-36 md:w-48 rounded-xl border-2 flex items-center justify-between px-3 cursor-pointer transition-all ${p1Style}`}
                                            title={p1Data ? (r > 0 && !p1Won && !p1Lost && !p2Data ? "Clique para remover e voltar para a fase anterior" : "Clique para avançar") : ""}
                                        >
                                            {p1Data ? (
                                                <>
                                                    <span className="font-semibold truncate text-[11px] md:text-xs">{p1Data.map(mc=>mc.name).join(' / ')}</span>
                                                    {r > 0 && !p1Won && (
                                                        <button
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                revertParticipantFromSlot(r, m * 2);
                                                            }}
                                                            className="ml-1 p-0.5 rounded-full hover:bg-red-500/30 text-zinc-400 hover:text-red-300 transition-colors"
                                                            title="Voltar para a fase anterior"
                                                        >
                                                            <Icon name="x" size={12} />
                                                        </button>
                                                    )}
                                                </>
                                            ) : <span className="text-[9px] uppercase font-semibold">Aguardando</span>}
                                        </div>
                                        <div 
                                            onClick={() => {
                                                if (!p2Data) return;
                                                if (r > 0 && !p2Won && !p2Lost && !p1Data) {
                                                    revertParticipantFromSlot(r, m * 2 + 1);
                                                    return;
                                                }
                                                if (p2Won) return;
                                                advanceParticipant(r, m, p2Data, p1Data);
                                            }}
                                            onContextMenu={(e) => {
                                                if (r > 0 && p2Data) {
                                                    e.preventDefault();
                                                    revertParticipantFromSlot(r, m * 2 + 1);
                                                }
                                            }}
                                            style={p2VtName ? { viewTransitionName: p2VtName } : {}}
                                            className={`h-[44px] w-36 md:w-48 rounded-xl border-2 flex items-center justify-between px-3 cursor-pointer transition-all ${p2Style}`}
                                            title={p2Data ? (r > 0 && !p2Won && !p2Lost && !p1Data ? "Clique para remover e voltar para a fase anterior" : "Clique para avançar") : ""}
                                        >
                                            {p2Data ? (
                                                <>
                                                    <span className="font-semibold truncate text-[11px] md:text-xs">{p2Data.map(mc=>mc.name).join(' / ')}</span>

                                                            onClick={(e) => {

                                                            }}

                                                        >
                                                            <Icon name="x" size={12} />
                                                        </button>
                                                    )}
                                                </>
                                            ) : <span className="text-[9px] uppercase font-semibold">Aguardando</span>}
                                        </div>
                                    </div>
                                </div>
                            );
                        }

                    rounds.push(
                        <div key={`round-${r}`} className="flex flex-col justify-around h-full min-w-[180px] md:min-w-[220px] relative px-2">
                            {rounds.length > 0 && r < numRounds && (

                            )}
                            {matches}
                        </div>
                    );
                }

                return (
                    <div className="flex w-full h-[650px] overflow-x-auto overflow-y-auto apple-glass rounded-3xl p-4 md:p-6 custom-scrollbar">
                        <div className="flex flex-row h-full min-w-max pb-4">
                            {rounds}
                        </div>
                    </div>

                                                <button 
                                                    onClick={() => setAllowRepetition(!allowRepetition)}
                                                    className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${allowRepetition ? 'bg-green-500' : 'bg-white/20 border border-white/20 repetition-btn-off'}`}
                                                >
                                                    <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform shadow-md ${allowRepetition ? 'translate-x-6' : 'translate-x-1'}`} />
                                                </button>
                                            </div>
                                            <p className="text-[10px] text-zinc-400">Permite que um mesmo {configGroupSize === 1 ? 'MC' : 'grupo'} seja sorteado mais de uma vez.</p>
                                        </div>
                                    )}
                                </div>
                                
                                <button 
                                    onClick={() => setIsSettingsOpen(false)} 
                                    className="w-full mt-10 py-3.5 bg-red-600 hover:bg-red-500 text-white text-sm font-semibold rounded-2xl cursor-pointer transition-colors shadow-md shadow-red-600/20 settings-concluir-btn"
                                >
                                    Concluir
                                </button>
                            </div>
                        </div>
                    )}

                    {isHelpOpen && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-black/40 backdrop-blur-2xl">
                            <div 
                                className="trio-tilt-card animate-modal-pop apple-glass p-8 rounded-[2rem] max-w-xl w-full relative"
                                onMouseMove={handleCardMouseMove}
                                onMouseLeave={handleCardMouseLeave}
                            >
                                <button 
                                    onClick={() => setIsHelpOpen(false)}
                                    className="absolute top-5 right-5 flex items-center justify-center w-8 h-8 text-zinc-400 hover:text-white transition-colors cursor-pointer bg-white/10 rounded-full hover:bg-white/20"
                                >
                                    <Icon name="x" size={18} />
                                </button>
                                
                                <div className="flex items-center gap-4 mb-8">
                                    <div className="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center border border-white/20 text-zinc-100 shadow-inner">
                                        <Icon name="info" size={20} strokeWidth={1.5} />
                                    </div>
                                    <h2 className="text-xl font-semibold tracking-tight text-zinc-100">Como usar o site</h2>
                                </div>
                                
                                <div className="space-y-4 text-sm text-zinc-300 leading-relaxed overflow-y-auto max-h-[60vh] pr-4 font-medium">
                                    <p><strong className="text-white">Modo Draft:</strong> Nesse modo você pode adicionar todos os mc's participantes, definir os capitães e sortear a ordem de escolhas dos integrantes. Feito para facilitar a escolha dos grupos de forma fluida e simples.</p>
                                    <p><strong className="text-white">Modo Chaveamento:</strong> Nesse modo você pode adicionar todos os mc's (basta clicar no nome deles para auto-adicionar nas caixas) e sortear a ordem individual dos confrontos. Feito para sortear a ordem de confrontos de uma batalha, assim dispensando utilização sorteio no papel ou em sites externos.</p>
                                    <p><strong className="text-white">Modo Folhinha:</strong> Visualize e gerencie a chave do torneio. Os MCs/Grupos sorteados no Modo Chaveamento são enviados automaticamente para cá. Clique nos vencedores para avançá-los de fase até a final!</p>
                                    <hr className="border-white/10 my-4" />
                                    <p><strong className="text-white">1. Adicionar MC's:</strong> Digite o nome do MC na barra lateral (ou cole uma lista separada por vírgulas/linhas) e clique no "+" ou aperte "Enter".</p>
                                    <p><strong className="text-yellow-400">2. Capitães (Cor Dourada - Draft):</strong> Arraste o MC para o 1º espaço de qualquer trio para marcá-lo como Capitão.</p>
                                    <p><strong className="text-green-400">3. Formar Grupos:</strong> Arraste os outros MC's para preencher as caixas. Com as pessoas suficientes, a borda ficará verde indicando completo.</p>
                                    <p><strong className="text-always-red text-red-400">4. Sortear Ordem:</strong> Clique no botão no topo. Ele embaralhará todas as posições (Draft), sorteará um participante para a chave (Chaveamento) ou embaralhará os confrontos da fase atual (Folhinha).</p>
                                    <p><strong className="text-blue-400">5. Customizar:</strong> Clique no Título "Batalha da Torre" para editá-lo e mudar a cor. Clique na Logo para alterar a imagem.</p>
                                </div>
                                
                                <button 
                                    onClick={() => setIsHelpOpen(false)} 
                                    className="w-full mt-10 py-3.5 bg-white/10 hover:bg-white/20 text-zinc-100 text-sm font-semibold rounded-2xl cursor-pointer transition-colors backdrop-blur-md"
                                >
                                    Entendi
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
